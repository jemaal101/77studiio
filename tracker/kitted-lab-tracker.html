<title>Kitted Lab Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="app-css">
:root{
  --bg:#EDF1F4; --panel:#FFFFFF; --panel-2:#F4F7F9; --panel-3:#E9EFF4;
  --ink:#0D141B; --ink-2:#3C4956; --muted:#6A7A8A;
  --line:#D6DEE6; --line-2:#E7EDF3;
  --accent:#1A4FD0; --accent-ink:#FFFFFF; --accent-soft:#E4EAFB; --accent-line:#B7C9F2;
  --good:#0A6E47; --good-soft:#DBF0E6; --good-line:#A5DAC4;
  --warn:#94490A; --warn-soft:#F9E9D8; --warn-line:#EDC9A2;
  --bad:#A32820; --bad-soft:#F9E2E0; --bad-line:#EDB8B3;
  --shadow:0 1px 2px rgba(13,28,45,.06), 0 12px 32px -20px rgba(13,28,45,.35);
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1016; --panel:#141C25; --panel-2:#1A232E; --panel-3:#212C38;
    --ink:#E8EFF6; --ink-2:#B6C4D2; --muted:#8496A7;
    --line:#26333F; --line-2:#1C2731;
    --accent:#7CA3FF; --accent-ink:#06101F; --accent-soft:#182742; --accent-line:#2B4470;
    --good:#48D099; --good-soft:#0E2A20; --good-line:#1E4B39;
    --warn:#E7A661; --warn-soft:#2D2114; --warn-line:#543D23;
    --bad:#F2857D; --bad-soft:#301B1A; --bad-line:#5A2F2C;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 36px -22px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1016; --panel:#141C25; --panel-2:#1A232E; --panel-3:#212C38;
  --ink:#E8EFF6; --ink-2:#B6C4D2; --muted:#8496A7;
  --line:#26333F; --line-2:#1C2731;
  --accent:#7CA3FF; --accent-ink:#06101F; --accent-soft:#182742; --accent-line:#2B4470;
  --good:#48D099; --good-soft:#0E2A20; --good-line:#1E4B39;
  --warn:#E7A661; --warn-soft:#2D2114; --warn-line:#543D23;
  --bad:#F2857D; --bad-soft:#301B1A; --bad-line:#5A2F2C;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 36px -22px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  margin:0;font-weight:700;letter-spacing:-.012em;text-wrap:balance}
.num{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------------- shell ---------------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.rail{display:none}
.main{min-width:0;padding-bottom:96px}
@media (min-width:1000px){
  .shell{grid-template-columns:250px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;padding:20px 14px;
        background:var(--panel);border-right:1px solid var(--line)}
  .main{padding-bottom:0}
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--panel);
  display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;letter-spacing:-.05em;flex:none}
.brand-name{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:17px;line-height:1.15}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.11em;text-transform:uppercase;font-weight:600}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;border:0;background:transparent;
  color:var(--ink-2);cursor:pointer;text-align:left;font-weight:500;font-size:15.5px;width:100%;transition:background .12s}
.navbtn:hover{background:var(--panel-2)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navbtn>svg{width:19px;height:19px;flex:none}
.navbtn .pip{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;
  background:var(--bad);color:#fff;border-radius:20px;padding:1px 7px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line-2)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-auto-flow:column;
  grid-auto-columns:minmax(0,1fr);background:var(--panel);border-top:1px solid var(--line);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.tabbtn{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 2px;border-radius:9px;cursor:pointer;font-size:11px;font-weight:600;position:relative;min-width:0;overflow:hidden}
.tabbtn>svg{width:21px;height:21px}
.tabbtn[aria-current="page"]{color:var(--accent)}
.tabbtn .pip{position:absolute;top:1px;right:calc(50% - 19px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
@media (min-width:1000px){.tabbar{display:none}}

/* ---------------- topbar ---------------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:14px 16px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
@media (min-width:1000px){.top{padding:16px 30px}}
.top h1{font-size:23px}
.top .spacer{flex:1}
.savechip{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.dot.pending{background:var(--warn)} .dot.off{background:var(--muted)}

/* ---------------- buttons ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;
  font-size:15px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel-2);border-color:var(--muted)}
.btn>svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.09)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.btn.ok{color:var(--good);border-color:var(--good-line);background:var(--good-soft)}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:9px}
.btn.sm>svg{width:15px;height:15px}
.btn.icon{padding:9px;border-radius:9px}
.btn.icon.sm{padding:7px}
.btn.big{padding:14px 20px;font-size:16px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:35;
  width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;box-shadow:0 8px 24px -6px rgba(26,79,208,.55);cursor:pointer}
.fab>svg{width:26px;height:26px}
@media (min-width:1000px){.fab{display:none}}

/* ---------------- blocks ---------------- */
.wrap{padding:16px}
@media (min-width:1000px){.wrap{padding:24px 30px 70px}}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:11px;padding:15px 17px;border-bottom:1px solid var(--line-2);min-width:0}
.card-h h3{font-size:17px;min-width:0;overflow-wrap:anywhere}
.card-h .spacer{flex:1}
.card-h>svg{width:18px;height:18px;flex:none;color:var(--muted)}
.card-b{padding:17px}
.card-b.flush{padding:0}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sec-h h2{font-size:19px}
.sec-h .spacer{flex:1}
.grid{display:grid;gap:14px;min-width:0;align-items:start}
.g2{grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------------- headline money ---------------- */
.headline{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 22px 20px;box-shadow:var(--shadow)}
.headline .lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.headline .big{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:clamp(38px,10vw,54px);font-weight:600;letter-spacing:-.045em;line-height:1.02;margin-top:6px}
.headline .sub{margin-top:8px;color:var(--muted);font-size:14.5px}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px}
@media (min-width:900px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow)}
.tile .lab{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:26px;
  font-weight:600;letter-spacing:-.035em;line-height:1.15;margin-top:5px}
.tile .sub{font-size:13px;color:var(--muted);margin-top:3px}
.tile.tap{cursor:pointer} .tile.tap:hover{border-color:var(--accent-line)}
.pos{color:var(--good)} .neg{color:var(--bad)} .amb{color:var(--warn)}

/* ---------------- chips ---------------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 10px;
  border-radius:20px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);border-color:var(--good-line);color:var(--good)}
.chip.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.chip.acc{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ---------------- job cards ---------------- */
.jobs{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.jobs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1500px){.jobs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.job{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden}
.job-top{padding:15px 16px 13px;cursor:pointer}
.job-top:hover{background:var(--panel-2)}
.job-row1{display:flex;align-items:flex-start;gap:12px}
.job-who{flex:1;min-width:0}
.job-who .n{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:18px;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job-who .c{font-size:14px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job-price{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:21px;
  font-weight:600;letter-spacing:-.035em;text-align:right;flex:none}
.job-meta{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.job-when{font-size:13.5px;color:var(--muted);font-weight:500}
.job-acts{display:flex;gap:7px;padding:11px 16px;border-top:1px solid var(--line-2);background:var(--panel-2);flex-wrap:wrap}
.job-acts .spacer{flex:1}

/* ---------------- rows / lists ---------------- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:13px;padding:13px 17px;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer} .row.tap:hover{background:var(--panel-2)}
.row>svg{width:17px;height:17px;flex:none;color:var(--muted)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px}
.row .s{font-size:13px;color:var(--muted)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------------- tables ---------------- */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
thead th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}
td.num,th.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th.wcol{width:34%}
.rowtitle{font-weight:600}
.rowsub{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:5px;justify-content:flex-end}
@media (max-width:719px){
  .responsive thead{display:none}
  .responsive tbody tr{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;padding:14px;border-bottom:1px solid var(--line-2)}
  .responsive tbody tr:hover{background:transparent}
  .responsive tbody td{display:flex;justify-content:space-between;gap:14px;padding:3px 0;border:0;text-align:left}
  .responsive tbody td.num{justify-content:space-between}
  .responsive tbody td[data-l]::before{content:attr(data-l);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);font-weight:600;font-family:"IBM Plex Sans",sans-serif;flex:none}
  .responsive tbody td.wide{display:block;padding-bottom:7px}
  .responsive tbody td.actcell{padding-top:11px}
  .responsive tbody td.actcell .acts{justify-content:flex-start}
}

/* ---------------- meters ---------------- */
.meter{height:7px;border-radius:5px;background:var(--panel-3);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:5px}
.brk{margin-bottom:14px}
.brk-t{display:flex;gap:10px;font-size:14.5px;align-items:baseline}
.brk-t .n{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------------- inputs ---------------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.inp{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:16px}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea.inp{min-height:82px;resize:vertical;font-size:15px;line-height:1.6}
.hint{font-size:13.5px;color:var(--muted);line-height:1.55}
.search{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:0 13px;flex:1;min-width:0}
.search input{border:0;background:transparent;padding:11px 0;width:100%;font-size:16px}
.search input:focus{outline:none}
.search>svg{width:17px;height:17px;color:var(--muted);flex:none}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;overflow:auto}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;cursor:pointer;font-size:14px;
  font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);padding:9px 14px;
  border-radius:22px;cursor:pointer;font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.pick button:hover{border-color:var(--muted)}
.pick button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pick button>svg{width:14px;height:14px}
@media (max-width:719px){
  .toolbar .search{flex:1 1 100%}
  .toolbar .seg{flex:1 1 100%}
  .toolbar .seg button{flex:1}
}

/* ---------------- drawer ---------------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(6,14,22,.55);backdrop-filter:blur(3px);
  display:flex;justify-content:flex-end;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{background:var(--panel);width:min(580px,100%);height:100%;display:flex;flex-direction:column;
  box-shadow:-24px 0 70px -34px rgba(0,0,0,.7);animation:slide .2s cubic-bezier(.2,.8,.3,1)}
@keyframes slide{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:640px){
  .scrim{align-items:flex-end}
  .drawer{width:100%;height:min(95vh,100%);border-radius:18px 18px 0 0;animation:up .22s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{transform:translateY(32px);opacity:.5}to{transform:none;opacity:1}}
}
.drawer-h{display:flex;align-items:center;gap:11px;padding:17px 20px;border-bottom:1px solid var(--line)}
.drawer-h h3{font-size:19px;flex:1}
.drawer-b{padding:20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.drawer-f{display:flex;gap:10px;padding:15px 20px calc(15px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--panel-2)}
.drawer-f .spacer{flex:1}
.fgrid{display:grid;gap:15px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}
@media (max-width:540px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.more{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14.5px;cursor:pointer;
  padding:6px 0;display:inline-flex;align-items:center;gap:7px;align-self:flex-start}
.more>svg{width:15px;height:15px}
.linebox{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--panel-2)}
.itemline{display:grid;grid-template-columns:minmax(0,1fr) 76px 100px auto;gap:8px;align-items:center}
@media (max-width:540px){.itemline{grid-template-columns:repeat(2,minmax(0,1fr))}.itemline .full2{grid-column:1/-1}}

/* ---------------- misc ---------------- */
.empty{text-align:center;padding:46px 22px;color:var(--muted)}
.empty>svg{width:34px;height:34px;color:var(--muted);opacity:.6;margin-bottom:12px}
.empty h3{color:var(--ink);margin-bottom:7px;font-size:19px}
.empty p{margin:0 auto 18px;max-width:42ch;font-size:15px}
.empty .acts2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.banner{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--r);
  border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:14.5px;font-weight:500}
.banner .spacer{flex:1}
.banner>svg{width:18px;height:18px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));z-index:80;
  background:var(--ink);color:var(--panel);padding:12px 18px;border-radius:11px;font-size:14.5px;font-weight:600;
  box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center}
@media (min-width:1000px){.toast{bottom:28px}}
.linkrow{display:flex;flex-wrap:wrap;gap:9px}
.linkrow a{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;text-decoration:none;
  border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--panel-2);color:var(--ink-2)}
.linkrow a:hover{border-color:var(--accent);color:var(--accent)}
.linkrow a>svg{width:15px;height:15px}
.check{display:flex;align-items:center;gap:12px;padding:13px 17px;border-bottom:1px solid var(--line-2)}
.check:last-child{border-bottom:0}
.check .bx{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.check .bx>svg{width:14px;height:14px}
.check.done .bx{background:var(--good);border-color:var(--good);color:var(--panel)}
.check.done .t{color:var(--muted);text-decoration:line-through}
.check .grow{flex:1;min-width:0}
.check .t{font-weight:600;font-size:15px}
.check .s{font-size:13px;color:var(--muted)}
</style>

<script type="application/json" id="app-data">{"v":2,"fresh":true}</script>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <div class="main">
    <header class="top" id="top"></header>
    <main id="app" class="wrap"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<button class="fab" id="fab" aria-label="Add something"></button>
<div id="layer"></div>

<script id="app-js">
/* =========================================================================
   Kitted Lab Tracker
   Jobs on cars (tint · detail · wrap · installation) + parts, stock,
   money in and out, and supplier contacts. One file, no server.
   ========================================================================= */
(function () {
  'use strict';

  /* ------------------------------------------------------------- icons */
  var I = {
    home:'<path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5v11h13v-11"/><path d="M9.5 20.5v-6h5v6"/>',
    car:'<path d="M3.5 16.5v-3l2-5.5h13l2 5.5v3"/><path d="M3.5 16.5h17v3h-3v-3M6.5 19.5v-3"/><path d="M6.5 13h3M14.5 13h3"/>',
    box:'<path d="M20.5 7.5 12 3 3.5 7.5v9L12 21l8.5-4.5v-9Z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>',
    wallet:'<path d="M3.5 7.5v11h17v-9h-13a2 2 0 0 1 0-4h11v2"/><circle cx="16.5" cy="14" r="1.2"/>',
    users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.4a3.2 3.2 0 0 1 0 5.2M17.5 14.9c2.1.6 3.5 2.4 3.5 5.1"/>',
    cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9 5.3 5.3"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/>',
    pencil:'<path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/>',
    trash:'<path d="M4 6.5h16M9.5 6.5V4h5v2.5M6.5 6.5 7.5 21h9l1-14.5"/>',
    down:'<path d="M12 3.5v12M7 11l5 5 5-5M4 20.5h16"/>',
    up:'<path d="M12 20.5v-12M7 13l5-5 5 5M4 3.5h16"/>',
    check:'<path d="m4.5 12.5 5 5 10-11"/>',
    x:'<path d="M6 6l12 12M18 6 6 18"/>',
    left:'<path d="m14.5 5-7 7 7 7"/>',
    right:'<path d="m9.5 5 7 7-7 7"/>',
    chevron:'<path d="m6 9.5 6 6 6-6"/>',
    phone:'<path d="M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 6 6L16.5 13l4 1.5v3a2 2 0 0 1-2.2 2C10.4 18.8 5.2 13.6 4.5 5.7a2 2 0 0 1 2-2.2Z"/>',
    mail:'<path d="M3.5 6.5h17v11h-17z"/><path d="m3.5 7.5 8.5 6 8.5-6"/>',
    globe:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c4.5 5 4.5 12 0 17-4.5-5-4.5-12 0-17Z"/>',
    chat:'<path d="M20.5 12c0 4.1-3.8 7.5-8.5 7.5-1 0-2-.2-2.9-.5L4 20.5l1.6-4A7 7 0 0 1 3.5 12C3.5 7.9 7.3 4.5 12 4.5s8.5 3.4 8.5 7.5Z"/>',
    alert:'<path d="M12 4.5 21 20H3l9-15.5Z"/><path d="M12 10v4.2M12 17.2v.1"/>',
    clip:'<path d="M8 4.5h8v3H8z"/><path d="M8 6H5.5v14.5h13V6H16"/><path d="M8.5 11h7M8.5 14.5h7M8.5 18h4"/>',
    truck:'<path d="M2.5 6.5h11v9h-11z"/><path d="M13.5 9.5h4l3 3v3h-7z"/><circle cx="6.5" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/>',
    money:'<path d="M3.5 6.5h17v11h-17z"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 12h.1M17.4 12h.1"/>',
    calendar:'<path d="M4 6.5h16v14H4z"/><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"/>',
    spark:'<path d="M12 3.5 13.9 9l5.6 1.9-5.6 1.9L12 18.4 10.1 12.8 4.5 10.9 10.1 9 12 3.5Z"/>'
  };
  function ico(k) {
    return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + I[k] + '</svg>';
  }

  /* ------------------------------------------------------------ helpers */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid(p) { return (p || 'x') + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
  function n(v) { var x = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isFinite(x) ? x : 0; }
  function cur() { return (S.meta && S.meta.currency) || '$'; }
  function money(v, dp) {
    var d = dp == null ? 0 : dp, x = n(v);
    return (x < 0 ? '-' : '') + cur() + Math.abs(x).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function money2(v) { return money(v, 2); }
  function pct(v) { return (isFinite(v) ? Math.round(v) : 0) + '%'; }
  function pad(x) { return x < 10 ? '0' + x : '' + x; }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function mKey(iso) { return (iso || '').slice(0, 7); }
  function curMonth() { return todayISO().slice(0, 7); }
  function shiftMonth(k, d) { var x = new Date(+k.slice(0, 4), +k.slice(5, 7) - 1 + d, 1); return x.getFullYear() + '-' + pad(x.getMonth() + 1); }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var DAY = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  function mLabel(k) { return MON[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4); }
  function dLabel(iso) { var p = (iso || '').split('-'); return p.length < 3 ? '—' : +p[2] + ' ' + MON[+p[1] - 1]; }
  function days(iso) {
    if (!iso) return null;
    return Math.round((new Date(iso + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 86400000);
  }
  function whenLabel(iso) {
    var d = days(iso);
    if (d == null) return 'No date';
    if (d === 0) return 'Today';
    if (d === 1) return 'Tomorrow';
    if (d === -1) return 'Yesterday';
    if (d > 1 && d < 7) return DAY[new Date(iso + 'T00:00:00').getDay()];
    return dLabel(iso) + (d < 0 ? '' : '');
  }
  function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function sortBy(a, f, dir) {
    return a.slice().sort(function (x, y) { var p = f(x), q = f(y); return p === q ? 0 : (p > q ? 1 : -1) * (dir === 'desc' ? -1 : 1); });
  }
  function plural(count, one, many) { return count + ' ' + (count === 1 ? one : (many || one + 's')); }

  /* ---------------------------------------------------------- constants */
  var JOB_STATUS = ['Enquiry', 'Booked', 'In progress', 'Done', 'Paid', 'Cancelled'];
  var OPEN_JOB = ['Enquiry', 'Booked', 'In progress'];
  var ORDER_STATUS = ['Ordered', 'Paid for', 'In transit', 'At customs', 'Arrived', 'Cancelled'];
  var OPEN_ORDER = ['Ordered', 'Paid for', 'In transit', 'At customs'];
  var EXP_CATS = ['Ads', 'Materials', 'Freight & duty', 'Tools & equipment', 'Rent', 'Wages', 'Software', 'Fees', 'Fuel & travel', 'Other'];
  var AD_PLATFORMS = ['Meta', 'Instagram', 'Google', 'TikTok', 'YouTube', 'Other'];
  var STOCK_CATS = ['Tint film', 'Wrap vinyl', 'Paint protection film', 'Detailing supplies', 'Body kit', 'Bumper',
    'Spoiler', 'Wheels', 'Exhaust', 'Suspension', 'Lighting', 'Interior', 'Tools', 'Other'];
  var STARTER_SERVICES = ['Window tint — full car', 'Window tint — front two', 'Windscreen strip',
    'Ceramic coating', 'Full detail', 'Interior detail', 'Cut & polish', 'Paint correction',
    'Full wrap', 'Partial wrap', 'Chrome delete', 'Paint protection film', 'Parts installation', 'Parts supply only'];
  var LS = 'kittedlab.tracker.v2';

  /* -------------------------------------------------------------- state */
  var S, UI, DIRTY = false, ARTIFACT = null, DOWNLOADS = null, READONLY = false, saving = false;

  function emptyState() {
    return {
      v: 2, stamp: 0,
      meta: { business: 'Kitted Lab', currency: '$', theme: 'system' },
      services: STARTER_SERVICES.map(function (nm) { return { id: uid('sv'), name: nm, price: 0, cost: 0 }; }),
      jobs: [], products: [], orders: [], expenses: [], suppliers: []
    };
  }

  function loadState() {
    var emb = null, local = null;
    try { emb = JSON.parse(document.getElementById('app-data').textContent); } catch (e) {}
    try { local = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}
    if (!emb || emb.fresh || emb.v !== 2) emb = emptyState();
    if (local && local.v === 2 && (local.stamp || 0) > (emb.stamp || 0)) { S = local; DIRTY = true; }
    else { S = emb; DIRTY = false; try { localStorage.removeItem(LS); } catch (e) {} }
    ['services', 'jobs', 'products', 'orders', 'expenses', 'suppliers'].forEach(function (k) {
      if (!Array.isArray(S[k])) S[k] = [];
    });
    if (!S.meta) S.meta = emptyState().meta;
  }

  function touch() { S.stamp = Date.now(); DIRTY = true; try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} renderChrome(); }

  /* --------------------------------------------------- self-publishing */
  var BODY_MARKUP =
    '<div class="shell">\n' +
    '  <nav class="rail" id="rail" aria-label="Sections"></nav>\n' +
    '  <div class="main">\n' +
    '    <header class="top" id="top"></header>\n' +
    '    <main id="app" class="wrap"></main>\n' +
    '  </div>\n' +
    '</div>\n' +
    '<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>\n' +
    '<button class="fab" id="fab" aria-label="Add something"></button>\n' +
    '<div id="layer"></div>\n' +
    '<div id="toasts"></div>';

  var HEAD_LINKS =
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600' +
    '&amp;family=IBM+Plex+Sans+Condensed:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">';

  /** Rebuild the whole page from its own stylesheet, script and current data. */
  function serialize() {
    var css = document.getElementById('app-css').outerHTML;
    var js = document.getElementById('app-js').textContent;
    var data = JSON.stringify(S).replace(/</g, '\\u003c');
    return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
      '<title>Kitted Lab Tracker</title>\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
      HEAD_LINKS + '\n' + css + '\n</head>\n<body>\n' +
      '<' + 'script type="application/json" id="app-data">' + data + '<\/script>\n' +
      BODY_MARKUP + '\n' +
      '<' + 'script id="app-js">' + js + '<\/script>\n</body>\n</html>';
  }

  function save() {
    if (saving) return;
    if (!ARTIFACT) { toast('Saved on this device.'); return; }
    if (READONLY) { toast('This is a look-only view.'); return; }
    saving = true; S.stamp = Date.now();
    try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
    try { sessionStorage.setItem('kl.ui', JSON.stringify(UI)); } catch (e) {}
    renderChrome();
    ARTIFACT.publish(serialize()).catch(function (err) {
      saving = false;
      var c = err && err.code;
      if (c === 'conflict') { toast('Someone saved before you — loading their version.'); return; }
      if (c === 'not_writer' || c === 'not_granted' || c === 'not_declared' || c === 'consent_required') {
        READONLY = true; toast('This view can only look, not save. Your changes stay on this device.');
      } else if (c === 'rate_limited') { toast('Saving too fast — wait a moment, then press Save again.'); }
      else if (c === 'too_large') { toast('Too much to save at once. Download a backup and clear old rows.'); }
      else { toast('Save did not go through. Your work is safe on this device — press Save again.'); }
      renderChrome();
    });
  }

  /* ------------------------------------------------------------ derived */
  function svc(id) { return byId(S.services, id); }
  function svcName(id) { var s = svc(id); return s ? s.name : ''; }
  function prod(id) { return byId(S.products, id); }
  function prodName(id) { var p = prod(id); return p ? p.name : 'Deleted item'; }
  function supName(id) { var s = byId(S.suppliers, id); return s ? s.name : ''; }
  function jobOpen(j) { return OPEN_JOB.indexOf(j.status) >= 0; }
  function orderOpen(o) { return OPEN_ORDER.indexOf(o.status) >= 0; }

  function partsCost(j) { return (j.parts || []).reduce(function (a, p) { return a + n(p.qty) * n(p.cost); }, 0); }
  function jobCost(j) { return partsCost(j) + n(j.materials); }
  function jobProfit(j) { return n(j.price) - jobCost(j); }
  function jobOwing(j) { return Math.max(0, n(j.price) - n(j.deposit)); }
  function jobTitle(j) {
    var names = (j.serviceIds || []).map(svcName).filter(Boolean);
    return names.length ? names.join(' + ') : (j.notes ? String(j.notes).split('\n')[0].slice(0, 60) : 'Job');
  }

  function incomingQty(pid) {
    var t = 0;
    S.orders.forEach(function (o) {
      if (!orderOpen(o)) return;
      (o.items || []).forEach(function (it) { if (it.productId === pid) t += n(it.qty); });
    });
    return t;
  }
  function orderGoods(o) { return (o.items || []).reduce(function (a, it) { return a + n(it.qty) * n(it.cost); }, 0); }
  function orderUnits(o) { return (o.items || []).reduce(function (a, it) { return a + n(it.qty); }, 0); }
  function orderTotal(o) { return orderGoods(o) + n(o.freight) + n(o.duties); }
  function orderLate(o) { var d = days(o.eta); return orderOpen(o) && d != null && d < 0; }

  function lowStock() { return S.products.filter(function (p) { return n(p.qty) <= n(p.reorder); }); }
  function lateOrders() { return S.orders.filter(orderLate); }
  function unpaidJobs() {
    return S.jobs.filter(function (j) { return j.status === 'Done' && jobOwing(j) > 0; });
  }
  function stockValue() {
    var v = { units: 0, cost: 0, retail: 0 };
    S.products.forEach(function (p) { v.units += n(p.qty); v.cost += n(p.qty) * n(p.cost); v.retail += n(p.qty) * n(p.price); });
    return v;
  }

  function monthStats(k) {
    var r = { in: 0, cost: 0, out: 0, ads: 0, jobs: 0, cars: 0 };
    S.jobs.forEach(function (j) {
      if (mKey(j.date) !== k) return;
      if (j.status === 'Paid') { r.in += n(j.price); r.cost += jobCost(j); r.jobs++; }
      if (j.status !== 'Cancelled') r.cars++;
    });
    S.expenses.forEach(function (e) {
      if (mKey(e.date) !== k) return;
      r.out += n(e.amount);
      if (e.category === 'Ads') r.ads += n(e.amount);
    });
    r.profit = r.in - r.cost - r.out;
    r.margin = r.in > 0 ? (r.profit / r.in) * 100 : 0;
    r.avg = r.jobs ? r.in / r.jobs : 0;
    r.roas = r.ads > 0 ? r.in / r.ads : 0;
    return r;
  }

  /* ------------------------------------------------------------- toasts */
  function toast(msg) {
    var el = document.createElement('div');
    el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(function () { el.remove(); }, 3400);
  }

  /* ------------------------------------------------------------- chrome */
  var TABS = [
    { id: 'home', label: 'Home', icon: 'home' },
    { id: 'jobs', label: 'Jobs', icon: 'car' },
    { id: 'stock', label: 'Stock', icon: 'box' },
    { id: 'money', label: 'Money', icon: 'wallet' },
    { id: 'contacts', label: 'Contacts', icon: 'users' }
  ];
  function alerts(id) {
    if (id === 'jobs') return unpaidJobs().length;
    if (id === 'stock') return lowStock().length + lateOrders().length;
    return 0;
  }

  function renderChrome() {
    document.getElementById('rail').innerHTML =
      '<div class="brand"><div class="brand-mark">KL</div><div style="min-width:0">' +
      '<div class="brand-name truncate">' + esc(S.meta.business || 'Kitted Lab') + '</div>' +
      '<div class="brand-sub">Tracker</div></div></div>' +
      '<button class="btn primary big block" data-act="quick" style="margin-bottom:14px">' + ico('plus') + 'Add something</button>' +
      TABS.map(function (t) {
        var a = alerts(t.id);
        return '<button class="navbtn" data-tab="' + t.id + '"' + (UI.tab === t.id ? ' aria-current="page"' : '') + '>' +
          ico(t.icon) + '<span>' + t.label + '</span>' + (a ? '<span class="pip">' + a + '</span>' : '') + '</button>';
      }).join('') +
      '<button class="navbtn" data-tab="settings"' + (UI.tab === 'settings' ? ' aria-current="page"' : '') + '>' +
      ico('cog') + '<span>Settings</span></button>' +
      '<div class="rail-foot">' + saveChip() + saveBtn(' block') + '</div>';

    document.getElementById('tabbar').innerHTML = TABS.map(function (t) {
      var a = alerts(t.id);
      return '<button class="tabbtn" data-tab="' + t.id + '"' + (UI.tab === t.id ? ' aria-current="page"' : '') + '>' +
        ico(t.icon) + '<span>' + t.label + '</span>' + (a ? '<span class="pip"></span>' : '') + '</button>';
    }).join('');

    document.getElementById('fab').innerHTML = ico('plus');

    var t = TABS.concat([{ id: 'settings', label: 'Settings' }]).filter(function (x) { return x.id === UI.tab; })[0] || TABS[0];
    document.getElementById('top').innerHTML =
      '<h1>' + esc(t.label) + '</h1><div class="spacer"></div>' + saveChip() +
      '<button class="btn icon" data-tab="settings" aria-label="Settings" style="display:none" id="gear">' + ico('cog') + '</button>' +
      saveBtn('');
    var gear = document.getElementById('gear');
    if (gear && window.innerWidth < 1000) gear.style.display = '';
  }
  function saveChip() {
    var cls = '', txt = 'All saved';
    if (READONLY) { cls = 'off'; txt = 'Look only'; }
    else if (saving) { cls = 'pending'; txt = 'Saving…'; }
    else if (DIRTY) { cls = 'pending'; txt = 'Not saved yet'; }
    else if (!ARTIFACT) { cls = 'off'; txt = 'This device only'; }
    return '<span class="savechip"><i class="dot ' + cls + '"></i>' + txt + '</span>';
  }
  function saveBtn(extra) {
    if (READONLY || !ARTIFACT) return '';
    return '<button class="btn ' + (DIRTY ? 'primary' : '') + extra + '" data-act="save"' +
      (DIRTY && !saving ? '' : ' disabled') + '>' + ico('check') + 'Save</button>';
  }

  /* =============================== HOME ================================ */
  function monthBar() {
    return '<div class="toolbar">' +
      '<div class="seg" style="flex:none">' +
      '<button data-act="month" data-d="-1" aria-label="Previous month">' + ico('left') + '</button>' +
      '<button aria-pressed="true" style="min-width:104px">' + mLabel(UI.month) + '</button>' +
      '<button data-act="month" data-d="1" aria-label="Next month">' + ico('right') + '</button></div>' +
      (UI.month !== curMonth() ? '<button class="btn ghost" data-act="month-now">This month</button>' : '') +
      '</div>';
  }

  function viewHome() {
    var m = UI.month, r = monthStats(m);
    var owed = S.jobs.reduce(function (a, j) { return a + (j.status === 'Done' ? jobOwing(j) : 0); }, 0);
    var h = monthBar();

    h += '<div class="headline">' +
      '<div class="lab">Profit in ' + esc(mLabel(m)) + '</div>' +
      '<div class="big ' + (r.profit > 0 ? 'pos' : r.profit < 0 ? 'neg' : '') + '">' + money(r.profit) + '</div>' +
      '<div class="sub">' + money(r.in) + ' came in · ' + money(r.cost + r.out) + ' went out' +
      (r.in > 0 && r.profit >= 0 ? ' · you keep ' + pct(r.margin) + ' of every dollar' :
        r.profit < 0 ? ' · more going out than coming in' : '') + '</div></div>';

    h += '<div class="tiles">' +
      tile('Money in', money(r.in), plural(r.jobs, 'job') + ' paid', 'jobs') +
      tile('Costs & bills', money(r.cost + r.out), 'Jobs ' + money(r.cost) + ' · bills ' + money(r.out), 'money') +
      tile('Still owed', money(owed), owed ? plural(unpaidJobs().length, 'job') + ' to chase' : 'Nothing outstanding', 'jobs') +

  function whereMoneyCame(m) {
    var agg = {};
    S.jobs.forEach(function (j) {
      if (mKey(j.date) !== m || j.status !== 'Paid') return;
      var ids = (j.serviceIds || []).length ? j.serviceIds : ['_other'];
      var share = n(j.price) / ids.length;
      ids.forEach(function (id) {
        var k = id === '_other' ? 'Other work' : (svcName(id) || 'Other work');
        agg[k] = (agg[k] || 0) + share;
      });
    });
    var rows = sortBy(Object.keys(agg).map(function (k) { return { n: k, v: agg[k] }; }), function (x) { return x.v; }, 'desc').slice(0, 8);
    var total = rows.reduce(function (a, x) { return a + x.v; }, 0) || 1;
    if (!rows.length) return '';
    return '<section class="card" style="margin-top:14px"><div class="card-h">' + ico('spark') +
      '<h3>What earned the most</h3></div><div class="card-b">' +
      rows.map(function (x) {

          '<span class="num">' + money(x.v) + '</span></div>' +

  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  var ALIAS = {

    suppliers: { supplier: 'name', company: 'name', businessname: 'name', contactperson: 'contact', person: 'contact', personyoudealwith: 'contact', mobile: 'phone', tel: 'phone', wechat: 'whatsapp', web: 'website', url: 'website', leadtime: 'leadTime', leadtimedays: 'leadTime', howmanydaystheytake: 'leadTime', paymentterms: 'terms', whereitheyare: 'country', whereareyare: 'country', location: 'country' },
    expenses: { spend: 'amount', cost: 'amount', total: 'amount', howmuch: 'amount', when: 'date', whatkind: 'category', type: 'category', paidto: 'vendor', payee: 'vendor', supplier: 'vendor', whatfor: 'campaign', description: 'campaign', purpose: 'campaign', adplatform: 'platform', whichadplatform: 'platform', channel: 'platform' },
    jobs: { name: 'customer', client: 'customer', customername: 'customer', vehicle: 'car', make: 'car', model: 'car', plate: 'rego', registration: 'rego', when: 'date', amount: 'price', charged: 'price', total: 'price', priceyouarecharging: 'price', whereitisat: 'status', deposit: 'deposit' }
  };
  function fieldFor(kind, header) {
    var h = norm(header), a = ALIAS[kind] || {}, hit = null;
    if (a[h]) return a[h];
    KIND[kind].fields.forEach(function (f) {
      if (f.t === 'lines' || f.t === 'services') return;
      if (norm(f.k) === h || norm(f.l) === h) hit = f.k;
    });
    return hit;
  }
  function splitLine(line, d) {
    var out = [], cur = '', q = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (q) { if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
      else if (c === '"') q = true;
      else if (c === d) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out.map(function (x) { return x.trim(); });
  }
  function normDate(v) {
    v = String(v || '').trim(); if (!v) return '';
    if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
    var m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (m) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad(+m[2]) + '-' + pad(+m[1]);
    var d = new Date(v);
    return isNaN(d) ? '' : d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function findSupplier(v, commit) {
    v = String(v || '').trim(); if (!v) return '';
    if (byId(S.suppliers, v)) return v;
    for (var i = 0; i < S.suppliers.length; i++) if (norm(S.suppliers[i].name) === norm(v)) return S.suppliers[i].id;
    if (!commit) return '';
    var s = blank('suppliers'); s.name = v; S.suppliers.push(s); return s.id;
  }

  function buildImport(kind, text, commit) {
    var lines = String(text).replace(/\r\n?/g, '\n').split('\n').filter(function (l) { return l.trim(); });
    if (!lines.length) return { rows: [], skipped: 0 };
    var d = lines[0].indexOf('\t') >= 0 ? '\t' : ',';
    var table = lines.map(function (l) { return splitLine(l, d); });
    var usable = KIND[kind].fields.filter(function (f) { return f.t !== 'lines' && f.t !== 'services'; });
    var mapped = table[0].map(function (hh) { return fieldFor(kind, hh); });
    var cols, body;
    if (mapped.filter(Boolean).length >= 2) { cols = mapped; body = table.slice(1); }
    else { cols = usable.map(function (f) { return f.k; }); body = table; }

    var rows = [], skipped = 0;
    body.forEach(function (cells) {
      if (!cells.join('').trim()) return;
      var rec = blank(kind);
      cols.forEach(function (k, i) {
        if (!k || i >= cells.length) return;
        var v = cells[i];
        if (k === 'supplierId') { var sid = findSupplier(v, commit); rec.supplierId = sid; if (!sid && String(v).trim()) rec._new = String(v).trim(); return; }
        var f = usable.filter(function (x) { return x.k === k; })[0];
        rec[k] = f && (f.t === 'money' || f.t === 'int') ? n(v) : f && f.t === 'date' ? normDate(v) : v;
      });
      var bad = (kind === 'expenses' && !n(rec.amount)) ||
        ((kind === 'products' || kind === 'suppliers') && !String(rec.name).trim()) ||
        (kind === 'jobs' && !String(rec.customer).trim());
      if (bad) { skipped++; return; }
      if (kind === 'jobs' && JOB_STATUS.indexOf(rec.status) < 0) rec.status = 'Booked';
      if (!rec.date && KIND[kind].fields.some(function (f) { return f.k === 'date'; })) rec.date = todayISO();
      rows.push(rec);
    });
    return { rows: rows, skipped: skipped };
  }

  /* =============================== EXPORT =============================== */
  function csv(v) { var s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function toCSV(kind) {

  document.addEventListener('click', function (ev) {

    var svcBtn = ev.target.closest && ev.target.closest('[data-svc]');

    var el = ev.target.closest && ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), kind = el.getAttribute('data-kind');

    switch (act) {
      case 'close': closeDrawer(); break;
      case 'save': save(); break;
      case 'quick': openQuick(); break;

      case 'month': UI.month = shiftMonth(UI.month, +el.getAttribute('data-d')); render(); break;
      case 'month-now': UI.month = curMonth(); render(); break;
      case 'job-filter': UI.jobFilter = el.getAttribute('data-v'); render(); break;
      case 'stock-filter': UI.stockFilter = el.getAttribute('data-v'); render(); break;
      case 'money-view': UI.moneyView = el.getAttribute('data-v'); render(); break;
      case 'order-all': UI.orderAll = !UI.orderAll; render(); break;

      case 'new-job': openForm('jobs'); break;
      case 'edit-job': openForm('jobs', id); break;
      case 'new-product': openForm('products'); break;
      case 'edit-product': openForm('products', id); break;
      case 'new-order': openForm('orders'); break;
      case 'edit-order': openForm('orders', id); break;
      case 'new-expense': openForm('expenses'); break;
      case 'edit-expense': openForm('expenses', id); break;
      case 'new-supplier': openForm('suppliers'); break;
      case 'edit-supplier': openForm('suppliers', id); break;
      case 'new-service': openForm('services'); break;
      case 'edit-service': openForm('services', id); break;
      case 'form-save': saveForm(); break;

      case 'toggle-more': {
        var grid = document.getElementById('moregrid'), btn = document.getElementById('morebtn');
        var open = grid.hasAttribute('hidden');
        if (open) grid.removeAttribute('hidden'); else grid.setAttribute('hidden', '');
        btn.innerHTML = ico('chevron') + (open ? 'Hide extra details' : 'More details');
        break;
      }
      case 'line-add': {
        var host = document.getElementById('lines');
        if (!S.products.length) { toast('Add something to Stock first.'); break; }
        var po = S.products.map(function (p) { return { v: p.id, l: p.name + (n(p.qty) ? '  (' + n(p.qty) + ' in stock)' : '  (none in stock)') }; });
        host.insertAdjacentHTML('beforeend', lineRow({ productId: po[0].v, qty: 1, cost: n(S.products[0].cost) }, po));
        break;
      }
      case 'line-del': el.closest('.itemline').remove(); break;

      case 'job-status': {
        var j = byId(S.jobs, id);
        if (j) { j.status = el.getAttribute('data-v'); touch(); render(); toast('Moved to ' + j.status.toLowerCase() + '.'); }
        break;
      }
      case 'job-paid': {
        var jb = byId(S.jobs, id);
        if (!jb) break;
        confirmBox('Got paid?', esc(jb.customer || 'This customer') + ' paying ' + money(jobOwing(jb)) +
          ' makes this job ' + money(jb.price) + ' of money in for ' + mLabel(mKey(jb.date)) + '.', 'Yes, paid', false, function () {
            jb.status = 'Paid'; jb.deposit = n(jb.price);
            touch(); render(); toast('Nice. ' + money(jb.price) + ' in.');
          });
        break;
      }

      case 'adjust': openAdjust(id); break;
      case 'adj-step': { var ai = document.getElementById('adj'); ai.value = n(ai.value) + n(el.getAttribute('data-d')); break; }
      case 'adj-save': {
        var ap = prod(ADJUST);
        if (ap) { ap.qty = n(document.getElementById('adj').value); closeDrawer(); touch(); render(); toast('Count updated.'); }
        break;
      }

      case 'receive': {
        var o = byId(S.orders, id);
        if (!o) break;
        confirmBox('It arrived?', 'This puts ' + plural(orderUnits(o), 'unit') + ' onto your stock counts.', 'Yes, it arrived', false, function () {
          if (!o.applied) { applyLines(o.items, +1); o.applied = true; }
          o.status = 'Arrived';
          touch(); render(); toast('Stock updated.');
        });
        break;
      }

      case 'del': {
        var rec = byId(S[kind], id);
        if (!rec) break;
        var name = rec.customer || rec.name || rec.ref || rec.campaign || rec.vendor || 'this';
        var extra = '';
        if (kind === 'jobs' && (rec.parts || []).length) extra = ' The parts on it go back onto your stock count.';
        if (kind === 'orders' && rec.applied) extra = ' The units it added come back off your stock count.';
        if (kind === 'services') extra = ' Jobs already using it keep their price.';
        confirmBox('Delete this ' + KIND[kind].one + '?', esc(name) + '. ' + extra.trim() + ' You cannot undo it.', 'Delete', true, function () {
          if (kind === 'jobs') applyLines(rec.parts, +1);
          if (kind === 'orders' && rec.applied) applyLines(rec.items, -1);
          S[kind] = S[kind].filter(function (r) { return r.id !== id; });
          touch(); render(); toast('Deleted.');
        });
        break;
      }
      case 'confirm-yes': { var cb = PENDING; PENDING = null; closeDrawer(); if (cb) cb(); break; }

      case 'paste': openPaste(kind); break;
      case 'paste-go': commitPaste(); break;
      case 'export': exportKind(kind); break;
      case 'import-json': openImportJson(); break;
      case 'copy-all': {
        var ta = document.getElementById('copytext'); ta.focus(); ta.select();
        try { document.execCommand('copy'); toast('Copied.'); } catch (e) { toast('Press Ctrl or Cmd + C to copy.'); }
        break;
      }
      case 'restore': {
        var data;
        try { data = JSON.parse(document.getElementById('jsonin').value); } catch (e) { toast('That is not a backup file.'); break; }
        if (!data || data.v !== 2) { toast('That backup is from a different version.'); break; }
        S = data;
        ['services', 'jobs', 'products', 'orders', 'expenses', 'suppliers'].forEach(function (k) { if (!Array.isArray(S[k])) S[k] = []; });
        if (!S.meta) S.meta = emptyState().meta;
        closeDrawer(); applyTheme(); touch(); render(); toast('Backup is back. Press Save to keep it.');
        break;
      }
      case 'wipe': {
        confirmBox('Delete everything?', 'Every job, stock item, order, bill and contact goes. Download a backup first if you are not sure.', 'Delete everything', true, function () {
          var meta = S.meta, services = S.services;
          S = emptyState(); S.meta = meta; S.services = services;
          touch(); render(); toast('All clear.');
        });
        break;
      }
    }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'q') { UI.q = t.value; render(); return; }
    if (t.id === 'paste') { previewPaste(); return; }
    if (t.hasAttribute && t.hasAttribute('data-set')) {
      S.meta[t.getAttribute('data-set')] = t.value;
      if (t.getAttribute('data-set') === 'theme') applyTheme();
      touch();
      if (t.getAttribute('data-set') === 'business') renderChrome();
    }
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.getAttribute && t.getAttribute('data-ik') === 'productId') {
      var p = prod(t.value), row = t.closest('.itemline'), c = row && row.querySelector('[data-ik="cost"]');
      if (p && c && !n(c.value)) c.value = n(p.cost);
    }
    if (t.getAttribute && t.getAttribute('data-set') === 'theme') { S.meta.theme = t.value; applyTheme(); touch(); }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && document.querySelector('.scrim')) closeDrawer();
    if ((ev.metaKey || ev.ctrlKey) && ev.key === 's') { ev.preventDefault(); if (DIRTY) save(); }
  });
  window.addEventListener('beforeunload', function (e) {
    if (DIRTY && !saving && ARTIFACT && !READONLY) { e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('resize', function () { renderChrome(); });

  /* ================================ INIT ================================ */
  loadState();
  UI = { tab: 'home', month: curMonth(), q: '', jobFilter: 'open', stockFilter: 'all', moneyView: 'out', orderAll: false };
  try {
    var saved = JSON.parse(sessionStorage.getItem('kl.ui') || 'null');
    if (saved && saved.tab) { UI = saved; UI.q = ''; }
    sessionStorage.removeItem('kl.ui');
  } catch (e) {}
  applyTheme();
  render();

  if (window.claude && window.claude.use) {
    window.claude.use('artifact').then(function (a) { ARTIFACT = a; renderChrome(); });
    window.claude.use('downloads').then(function (d) { DOWNLOADS = d; });
  }
})();
</script>
