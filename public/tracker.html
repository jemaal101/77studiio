/* ==========================================================================
   Kitted Lab — workshop job-card system
   Graphite bezel · concrete ground · petrol teal + burnt orange
   Type: Barlow throughout, Roboto Mono for figures that line up in columns
   ========================================================================== */
:root{
  --ground:#E6E8E5; --panel:#FBFCFA; --sunk:#EFF1ED; --raised:#FFFFFF;
  --ink:#141A17; --ink-2:#3D4742; --muted:#5F6B65;
  --rule:#CFD5CE; --rule-2:#DFE3DD; --rule-hard:#AFB8B1;
  --bezel:#1A1F1E; --bezel-ink:#E7EDE9; --bezel-muted:#9AA6A0; --bezel-rule:#2C3432; --bezel-hot:#242B29;
  --acc:#07717D; --acc-fill:#0092A0; --acc-ink:#FFFFFF; --acc-wash:#DDEEF0; --acc-rule:#9CCBD1;
  --s1:#0092A0; --s2:#B4531B;
  --good:#197A4B; --good-wash:#DEEFE5; --good-rule:#A6D3BB;
  --bad:#B3261E; --bad-wash:#F8E3E1; --bad-rule:#E3B2AE;
  --grid:#E2E6E0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D1113; --panel:#151B1D; --sunk:#101618; --raised:#1B2224;
    --ink:#EAF0EC; --ink-2:#BAC6C0; --muted:#8D9994;
    --rule:#242C2E; --rule-2:#1D2426; --rule-hard:#33403F;
    --bezel:#101517; --bezel-ink:#EAF0EC; --bezel-muted:#8D9994; --bezel-rule:#212A2B; --bezel-hot:#1A2224;
    --acc:#5CCBD3; --acc-fill:#2CA3AC; --acc-ink:#06181A; --acc-wash:#123137; --acc-rule:#255B63;
    --s1:#2CA3AC; --s2:#D07A2C;
    --good:#57D394; --good-wash:#0E2C1E; --good-rule:#1E5138;
    --bad:#F48F87; --bad-wash:#2E1917; --bad-rule:#5A2C29;
    --grid:#222A2C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1113; --panel:#151B1D; --sunk:#101618; --raised:#1B2224;
  --ink:#EAF0EC; --ink-2:#BAC6C0; --muted:#8D9994;
  --rule:#242C2E; --rule-2:#1D2426; --rule-hard:#33403F;
  --bezel:#101517; --bezel-ink:#EAF0EC; --bezel-muted:#8D9994; --bezel-rule:#212A2B; --bezel-hot:#1A2224;
  --acc:#5CCBD3; --acc-fill:#2CA3AC; --acc-ink:#06181A; --acc-wash:#123137; --acc-rule:#255B63;
  --s1:#2CA3AC; --s2:#D07A2C;
  --good:#57D394; --good-wash:#0E2C1E; --good-rule:#1E5138;
  --bad:#F48F87; --bad-wash:#2E1917; --bad-rule:#5A2C29;
  --grid:#222A2C;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);
  font-family:Barlow,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.01em}
.num{font-family:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc-fill);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ------------------------------------------------------------ shell ----- */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.rail{display:none}
.main{min-width:0;padding-bottom:100px}
@media (min-width:1000px){
  .shell{grid-template-columns:250px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;
        padding:18px 12px;background:var(--bezel);color:var(--bezel-ink)}
  .main{padding-bottom:0}
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;border-bottom:1px solid var(--bezel-rule);margin-bottom:14px}
.brand-mark{width:38px;height:38px;border-radius:3px;background:var(--acc-fill);color:var(--acc-ink);
  display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.brand-name{font-weight:700;font-size:19px;line-height:1.15}
.brand-sub{font-size:13px;color:var(--bezel-muted);letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.navbtn{display:flex;align-items:center;gap:13px;padding:12px;border-radius:3px;border:0;background:transparent;
  color:var(--bezel-ink);cursor:pointer;text-align:left;font-weight:500;font-size:17px;width:100%;
  border-left:3px solid transparent;transition:background .1s}
.navbtn:hover{background:var(--bezel-hot)}
.navbtn[aria-current="page"]{background:var(--bezel-hot);color:#fff;border-left-color:var(--acc-fill);font-weight:700}
.navbtn>svg{width:20px;height:20px;flex:none}
.navbtn .pip{margin-left:auto;font-family:"Roboto Mono",monospace;font-size:12.5px;font-weight:500;
  background:var(--bad);color:#fff;border-radius:2px;padding:1px 6px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:9px;padding-top:14px;border-top:1px solid var(--bezel-rule)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-auto-flow:column;
  grid-auto-columns:minmax(0,1fr);background:var(--bezel);border-top:2px solid var(--acc-fill);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.tabbtn{border:0;background:transparent;color:var(--bezel-muted);display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:6px 2px;border-radius:3px;cursor:pointer;font-size:13px;font-weight:600;
  position:relative;min-width:0;overflow:hidden}
.tabbtn>svg{width:23px;height:23px}
.tabbtn span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* six tabs on a small phone: the labels give up a little size before they clip */
@media (max-width:420px){.tabbtn{font-size:11.5px;letter-spacing:-.01em;padding:6px 0}.tabbtn>svg{width:21px;height:21px}}
@media (max-width:340px){.tabbtn{font-size:10.5px}}
.tabbtn[aria-current="page"]{color:#fff}
.tabbtn[aria-current="page"]>svg{color:var(--acc)}
.tabbtn .pip{position:absolute;top:1px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
@media (min-width:1000px){.tabbar{display:none}}

/* ------------------------------------------------------------ topbar ---- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:13px 16px;
  background:var(--ground);border-bottom:1px solid var(--rule-hard)}
@media (min-width:1000px){.top{padding:15px 28px}}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.01em;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .spacer{flex:1}
.savechip{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
.dot.pending{background:var(--s2)} .dot.off{background:var(--muted)} .dot.bad{background:var(--bad)}
.rail .savechip{color:var(--bezel-muted)}
@media (max-width:680px){.top .savechip .lbl{display:none}.top .savechip{gap:0}}

/* ----------------------------------------------------------- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--rule-hard);
  background:var(--panel);color:var(--ink);padding:10px 16px;border-radius:3px;cursor:pointer;font-weight:600;
  font-size:16px;white-space:nowrap;transition:background .1s,border-color .1s}
.btn:hover{background:var(--sunk);border-color:var(--ink-2)}
.btn>svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--acc-fill);border-color:var(--acc-fill);color:var(--acc-ink)}
.btn.primary:hover{background:var(--acc);border-color:var(--acc)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:var(--bad-rule);background:var(--bad-wash)}
.btn.ok{color:var(--good);border-color:var(--good-rule);background:var(--good-wash)}
.btn.sm{padding:7px 12px;font-size:15px}
.btn.sm>svg{width:16px;height:16px}
.btn.icon{padding:9px}
.btn.icon.sm{padding:8px}
.btn.big{padding:14px 22px;font-size:17px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.rail .btn{background:transparent;border-color:var(--bezel-rule);color:var(--bezel-ink)}
.rail .btn:hover{background:var(--bezel-hot);border-color:var(--bezel-muted)}
.rail .btn.primary{background:var(--acc-fill);border-color:var(--acc-fill);color:var(--acc-ink)}
.fab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:35;
  width:60px;height:60px;border-radius:4px;border:0;background:var(--acc-fill);color:var(--acc-ink);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 0 -2px rgba(0,0,0,.2)}
.fab>svg{width:28px;height:28px}
@media (min-width:1000px){.fab{display:none}}

/* ------------------------------------------------------------ blocks ---- */
.wrap{padding:16px}
@media (min-width:1000px){.wrap{padding:22px 28px 64px}}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--rule-hard);border-radius:3px}
.card-h{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--rule);
  min-width:0;background:var(--sunk)}
.card-h h3{font-size:20px;font-weight:700;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.card-h .spacer{flex:1}
.card-h>svg{width:19px;height:19px;flex:none;color:var(--muted)}
.card-b{padding:16px}
.card-b.flush{padding:0}
.eyebrow{font-size:15px;color:var(--ink-2);font-weight:700}
.sec-h{display:flex;align-items:center;gap:10px 14px;margin:26px 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sec-h .line{flex:1 1 24px;min-width:24px;height:1px;background:var(--rule-hard)}
.grid{display:grid;gap:14px;min-width:0;align-items:start}
.g2{grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* --------------------------------------------------------- headline ----- */
.headline{background:var(--panel);border:1px solid var(--rule-hard);border-radius:3px;
  display:grid;grid-template-columns:minmax(0,1fr);border-top:3px solid var(--acc-fill)}
@media (min-width:760px){.headline{grid-template-columns:minmax(0,1fr) minmax(0,330px)}}
.headline-l{padding:20px 22px 18px}
.headline-r{padding:16px 18px;border-top:1px solid var(--rule)}
@media (min-width:760px){.headline-r{border-top:0;border-left:1px solid var(--rule)}}
.headline .lab{font-size:16px;color:var(--ink-2);font-weight:700}
.headline .big{font-size:clamp(44px,11vw,64px);font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:5px}
.headline .sub{margin-top:11px;color:var(--ink-2);font-size:17.5px;line-height:1.5}
.tiles{display:grid;gap:1px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px;
  background:var(--rule-hard);border:1px solid var(--rule-hard);border-radius:3px;overflow:hidden}
@media (min-width:900px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--panel);padding:15px 17px}
.tile .lab{font-size:15px;color:var(--ink-2);font-weight:700}
.tile .val{font-size:31px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:3px}
.tile .sub{font-size:15.5px;color:var(--muted);margin-top:2px}
.tile.tap{cursor:pointer} .tile.tap:hover{background:var(--sunk)}
.pos{color:var(--good)} .neg{color:var(--bad)} .amb{color:var(--s2)}

/* ------------------------------------------------------------- stage ---- */
.stages{display:grid;gap:1px;grid-template-columns:minmax(0,1fr);margin-top:14px;
  background:var(--rule-hard);border:1px solid var(--rule-hard);border-radius:3px;overflow:hidden}
@media (min-width:620px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:880px){.stages{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stages.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stage{background:var(--panel);padding:13px 15px;border-top:3px solid var(--rule-hard);cursor:pointer;
  text-align:left;font:inherit;color:inherit;border-left:0;border-right:0;border-bottom:0}
.stage:hover{background:var(--sunk)}
.stage.s-book{border-top-color:var(--muted)}
.stage.s-prog{border-top-color:var(--s2)}
.stage.s-owed{border-top-color:var(--bad)}
.stage.s-paid{border-top-color:var(--good)}
.stage{padding:16px 18px}
.stage .n{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-top:2px}
.stage .l{font-size:15px;color:var(--ink-2);font-weight:700}
.stage .v{font-size:16px;color:var(--muted);margin-top:3px}

/* ------------------------------------------------------------- tags ----- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;padding:4px 11px;
  border-radius:2px;border:1px solid var(--rule-hard);background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-wash);border-color:var(--good-rule);color:var(--good)}
.chip.bad{background:var(--bad-wash);border-color:var(--bad-rule);color:var(--bad)}
.chip.acc{background:var(--acc-wash);border-color:var(--acc-rule);color:var(--acc)}
.chip.amb{background:var(--panel);border-color:var(--s2);color:var(--s2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ------------------------------------------------------------- jobs ----- */
.jobs{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:880px){.jobs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1560px){.jobs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.job{background:var(--panel);border:1px solid var(--rule-hard);border-radius:3px;display:flex;flex-direction:column;
  overflow:hidden;border-left:5px solid var(--rule-hard)}
.job.s-book{border-left-color:var(--muted)}
.job.s-prog{border-left-color:var(--s2)}
.job.s-owed{border-left-color:var(--bad)}
.job.s-paid{border-left-color:var(--good)}
.job-top{padding:14px 16px 13px;cursor:pointer}
.job-top:hover{background:var(--sunk)}
.job-row1{display:flex;align-items:flex-start;gap:12px}
.job-who{flex:1;min-width:0}
.job-who .n{font-weight:700;font-size:21px;line-height:1.18;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job-who .c{font-size:16.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job-price{font-size:23px;font-weight:700;letter-spacing:-.02em;text-align:right;flex:none}
.job-meta{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
.job-when{font-size:16px;color:var(--muted);font-weight:500}
.job-acts{display:flex;gap:8px;padding:11px 16px;border-top:1px solid var(--rule);background:var(--sunk);flex-wrap:wrap}
.job-acts .spacer{flex:1}

/* ---------------------------------------------------------- calendar ---- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--rule-hard);
  border:1px solid var(--rule-hard);border-radius:3px;overflow:hidden}
.cal-head{background:var(--sunk);padding:10px 4px;text-align:center;font-size:14.5px;font-weight:700;
  color:var(--muted)}
.cal-day{background:var(--panel);min-height:118px;padding:8px;display:flex;flex-direction:column;gap:5px;
  cursor:pointer;text-align:left;border:0;font:inherit;color:inherit;align-items:stretch}
.cal-day:hover{background:var(--sunk)}
.cal-day.out{background:var(--sunk)}
.cal-day.out .cal-num{opacity:.45}
.cal-day.today{box-shadow:inset 0 0 0 3px var(--acc-fill)}
.cal-num{font-family:"Roboto Mono",monospace;font-size:15px;font-weight:500;color:var(--muted);flex:none}
.cal-day.today .cal-num{color:var(--acc);font-weight:600}
.cal-pill{border-left:4px solid var(--rule-hard);background:var(--sunk);padding:4px 7px;border-radius:2px;
  font-size:14px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-pill.s-book{border-left-color:var(--muted)}
.cal-pill.s-prog{border-left-color:var(--s2)}
.cal-pill.s-owed{border-left-color:var(--bad)}
.cal-pill.s-paid{border-left-color:var(--good)}
.cal-more{font-size:13.5px;color:var(--muted);font-weight:600}
.cal-dots{display:none;gap:4px;flex-wrap:wrap}
.cal-dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.cal-dot.s-prog{background:var(--s2)} .cal-dot.s-owed{background:var(--bad)} .cal-dot.s-paid{background:var(--good)}
.cal-money{font-size:13px;color:var(--muted);font-family:"Roboto Mono",monospace;margin-top:auto}
@media (max-width:719px){
  .cal-day{min-height:64px;padding:6px 4px;gap:4px;align-items:center}
  .cal-pill,.cal-money{display:none}
  .cal-dots{display:flex;justify-content:center}
  .cal-head{font-size:12.5px;letter-spacing:.04em}
}

/* ------------------------------------------------------------- rows ----- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--rule-2)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer} .row.tap:hover{background:var(--sunk)}
.row>svg{width:19px;height:19px;flex:none;color:var(--muted)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:17.5px}
.row .s{font-size:16px;color:var(--muted)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ------------------------------------------------------------ tables ---- */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16.5px}
thead th{text-align:left;font-size:15px;color:var(--ink-2);
  font-weight:700;padding:12px 14px;border-bottom:1px solid var(--rule-hard);white-space:nowrap;background:var(--sunk)}
tbody td{padding:12px 14px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sunk)}
td.num,th.num{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;
  white-space:nowrap;letter-spacing:-.02em}
th.wcol{width:34%}
.rowtitle{font-weight:600}
.rowsub{font-size:15.5px;color:var(--muted)}
.acts{display:flex;gap:6px;justify-content:flex-end}
@media (max-width:719px){
  .responsive thead{display:none}
  .responsive tbody tr{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;padding:14px;
    border-bottom:1px solid var(--rule)}
  .responsive tbody tr:hover{background:transparent}
  .responsive tbody td{display:flex;justify-content:space-between;gap:14px;padding:3px 0;border:0;text-align:left}
  .responsive tbody td.num{justify-content:space-between;flex-wrap:wrap}
  .responsive tbody td.num .sub2{flex:0 0 100%;text-align:right;white-space:normal;margin-top:0}
  .responsive tbody td[data-l]::before{content:attr(data-l);font-size:15px;
    color:var(--muted);font-weight:700;flex:none}
  .responsive tbody td.wide{display:block;padding-bottom:7px}
  .responsive tbody td.actcell{padding-top:11px}
  .responsive tbody td.actcell .acts{justify-content:flex-start}
}

/* ------------------------------------------------------------ charts ---- */
.chart{display:block;width:100%;max-width:100%;height:auto;overflow:visible}
.chart .grid-line{stroke:var(--grid);stroke-width:1}
.chart .axis-line{stroke:var(--rule-hard);stroke-width:1}
.chart .tick{font-family:"Roboto Mono",monospace;font-size:12.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .cat{font-family:Barlow,sans-serif;font-size:14px;fill:var(--muted);letter-spacing:.07em;
  text-transform:uppercase;font-weight:600}
.chart .cat.on{fill:var(--ink);font-weight:700}
.chart .s1{fill:var(--s1)} .chart .s2{fill:var(--s2)}
.chart .dim{opacity:.45}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover{fill:var(--ink);fill-opacity:.05}
.chart .spark-line{fill:none;stroke:var(--acc-fill);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .spark-zero{stroke:var(--rule-hard);stroke-width:1}
.chart .end-dot{fill:var(--acc-fill);stroke:var(--panel);stroke-width:2}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;color:var(--ink-2);margin-top:2px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block;flex:none}
.charttip{position:fixed;z-index:70;pointer-events:none;background:var(--bezel);color:var(--bezel-ink);
  border:1px solid var(--bezel-rule);border-radius:3px;padding:10px 12px;font-size:15px;line-height:1.5;
  white-space:nowrap;box-shadow:0 8px 20px -10px rgba(0,0,0,.6)}
.charttip b{letter-spacing:.09em;text-transform:uppercase;font-size:13.5px;color:var(--bezel-muted);
  font-weight:700;display:block;margin-bottom:4px}
.charttip .r{display:flex;align-items:center;gap:9px;font-family:"Roboto Mono",monospace;font-size:14.5px;
  font-variant-numeric:tabular-nums}
.charttip .r i{width:10px;height:10px;border-radius:2px;flex:none}
.hbar{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-bottom:14px}
.hbar-t{display:flex;gap:10px;align-items:baseline;font-size:16px}
.hbar-t .n{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-t .v{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums;font-size:15px;letter-spacing:-.02em}
.hbar-t .p{font-family:"Roboto Mono",monospace;font-size:14px;color:var(--muted);width:48px;text-align:right}
.track{height:10px;background:var(--sunk);border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.track>i{display:block;height:100%;background:var(--s1)}
.track>i.o{background:var(--s2)}
.meter{height:16px;background:var(--sunk);border:1px solid var(--rule-hard);border-radius:2px;position:relative;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--s1)}
.meter>u{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);opacity:.7}
.meter-legend{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;color:var(--muted);margin-top:6px}
.lvl{display:inline-flex;align-items:center;gap:9px;justify-content:flex-end}
.lvl .bar{width:56px;height:9px;background:var(--sunk);border:1px solid var(--rule);border-radius:2px;overflow:hidden;flex:none}
.lvl .bar>i{display:block;height:100%;background:var(--s1)}
.lvl .bar>i.low{background:var(--s2)}
.lvl .bar>i.out{background:var(--bad)}

/* ------------------------------------------------------------ inputs ---- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:16px;color:var(--ink-2);font-weight:600}
.inp{width:100%;background:var(--raised);border:1px solid var(--rule-hard);border-radius:3px;padding:12px 13px;font-size:17px}
.inp:focus{outline:3px solid var(--acc-fill);outline-offset:-1px;border-color:var(--acc-fill)}
textarea.inp{min-height:88px;resize:vertical;font-size:16.5px;line-height:1.55}
.hint{font-size:16.5px;color:var(--muted);line-height:1.55}
/* the running sum at the foot of a job: charge, minus the shelf, what is left */
.keep{margin-top:18px;border:1px solid var(--rule-hard);border-radius:4px;background:var(--sunk);padding:13px 15px}
.keep .kr{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:4px 0;
  font-size:15.5px;color:var(--ink-2)}
.keep .kr span:first-child{min-width:0}
.keep .kr span:last-child{flex:none}
.keep .kr.tot{border-top:1px solid var(--rule-hard);margin-top:7px;padding-top:9px;
  font-size:19px;font-weight:600;color:var(--ink)}
/* how far through the shipping window an order is */
.ship{display:flex;align-items:center;gap:10px;margin-top:11px}
.ship-bar{flex:1;min-width:0;height:6px;border-radius:3px;background:var(--sunk);
  border:1px solid var(--rule);overflow:hidden}
.ship-bar i{display:block;height:100%;background:var(--acc-fill)}
.ship-bar i.late{background:var(--bad)}
.ship-lab{flex:none;font-size:14px;color:var(--muted)}
/* the smaller line under a figure: its own row, never wrapping into the next column */
.sub2{display:block;font-size:13.5px;line-height:1.35;color:var(--muted);margin-top:2px;
  white-space:nowrap;font-family:"Roboto Mono",ui-monospace,monospace}
/* the invoice, full screen over everything, so it reads like the paper it is */
/* one tap to drop a price you already set onto an invoice */
.logobox{border:1px solid var(--rule-hard);border-radius:3px;background:#fff;padding:14px 16px;
  display:flex;align-items:center;justify-content:flex-start}
.logobox img{max-width:230px;max-height:66px;width:auto;height:auto;display:block}
.picks{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.pick-b{border:1px solid var(--rule-hard);background:var(--panel);color:var(--ink-2);border-radius:3px;
  padding:8px 11px;font:inherit;font-size:14.5px;font-weight:500;cursor:pointer;display:inline-flex;
  align-items:center;gap:8px;max-width:100%}
.pick-b:hover{border-color:var(--acc-fill);color:var(--acc);background:var(--acc-wash)}
.pick-b .num{color:var(--muted);font-weight:600}
.switch{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:500;cursor:pointer;
  padding:11px 13px;border:1px solid var(--rule-hard);border-radius:3px;background:var(--sunk)}
.switch input{width:20px;height:20px;flex:none;accent-color:var(--acc-fill);cursor:pointer}
.invwrap{position:fixed;inset:0;z-index:70;background:var(--ground);display:flex;flex-direction:column}
.invbar{display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--bezel);color:var(--bezel-ink);
  flex:none;flex-wrap:wrap}
.invbar strong{font-size:16px;font-weight:600;min-width:0}
.invbar .spacer{flex:1;min-width:0}
.invbar .btn{border-color:var(--bezel-rule);background:var(--bezel-hot);color:var(--bezel-ink)}
.invbar .btn.primary{background:var(--acc-fill);border-color:var(--acc-fill);color:var(--acc-ink)}
.invbar .btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.invpage{flex:1;min-height:0;overflow:auto;padding:22px 16px 40px;-webkit-overflow-scrolling:touch}
@media print{
  .shell,.tabbar,.fab,#toasts,.invbar,.scrim{display:none!important}
  .invwrap{position:static;background:#fff}
  .invpage{overflow:visible;padding:0}
  .paper{box-shadow:none;border:0;max-width:none;padding:0}
  body{background:#fff}
}
.search{display:flex;align-items:center;gap:10px;background:var(--raised);border:1px solid var(--rule-hard);
  border-radius:3px;padding:0 13px;flex:1;min-width:0}
.search input{border:0;background:transparent;padding:11px 0;width:100%;font-size:17px}
.search input:focus{outline:none}
.search>svg{width:19px;height:19px;color:var(--muted);flex:none}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--rule-hard);border-radius:3px;overflow:auto}
.seg button{border:0;border-right:1px solid var(--rule);background:transparent;padding:9px 15px;cursor:pointer;
  font-size:16px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--acc-fill);color:var(--acc-ink);font-weight:700}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1px solid var(--rule-hard);background:var(--panel);color:var(--ink-2);padding:9px 14px;
  border-radius:3px;cursor:pointer;font-size:16px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.pick button:hover{border-color:var(--ink-2)}
.pick button[aria-pressed="true"]{background:var(--acc-wash);border-color:var(--acc-fill);color:var(--acc);font-weight:700}
.pick button>svg{width:16px;height:16px}
@media (max-width:719px){
  .toolbar .search{flex:1 1 100%}
  .toolbar .seg{flex:1 1 100%}
  .toolbar .seg button{flex:1}
}

/* ------------------------------------------------------------ drawer ---- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,14,13,.6);display:flex;justify-content:flex-end;animation:fade .14s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{background:var(--panel);width:min(600px,100%);height:100%;display:flex;flex-direction:column;
  border-left:3px solid var(--acc-fill);animation:slide .18s cubic-bezier(.2,.8,.3,1)}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:640px){
  .scrim{align-items:flex-end}
  .drawer{width:100%;height:min(95vh,100%);border-left:0;border-top:3px solid var(--acc-fill);
    animation:up .2s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
}
.drawer-h{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--rule-hard);background:var(--sunk)}
.drawer-h h3{font-size:23px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.drawer-b{padding:18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.drawer-b.flush{padding:0;gap:0}
.drawer-f{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--rule-hard);background:var(--sunk)}
.drawer-f .spacer{flex:1}
@media (max-width:560px){
  .drawer-f .spacer{display:none}
  .drawer-f .btn{flex:1 1 auto;justify-content:center}
  .drawer-f .btn.icon{flex:none}
}
.fgrid{display:grid;gap:15px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}
@media (max-width:540px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.more{border:0;background:transparent;color:var(--acc);font-weight:700;font-size:16px;cursor:pointer;
  padding:8px 0;display:inline-flex;align-items:center;gap:8px;align-self:flex-start}
.more>svg{width:17px;height:17px}
.linebox{border:1px solid var(--rule-hard);border-radius:3px;padding:13px;display:flex;flex-direction:column;
  gap:10px;background:var(--sunk)}
.itemline{display:grid;grid-template-columns:minmax(0,1fr) 80px 104px auto;gap:8px;align-items:center}
@media (max-width:540px){.itemline{grid-template-columns:repeat(2,minmax(0,1fr))}.itemline .full2{grid-column:1/-1}}

/* ------------------------------------------------------------- misc ----- */
.empty{padding:26px 18px;display:flex;gap:16px;align-items:flex-start}
.empty>svg{width:28px;height:28px;color:var(--muted);flex:none;margin-top:2px}
.empty .body{flex:1;min-width:0}
.empty h3{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:7px}
.empty p{margin:0 0 15px;max-width:52ch;font-size:17px;color:var(--muted);line-height:1.55}
.empty .acts2{display:flex;gap:10px;flex-wrap:wrap}
.banner{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:3px;
  border:1px solid var(--acc-rule);background:var(--acc-wash);color:var(--acc);font-size:16px;font-weight:500}
.banner .spacer{flex:1}
.banner>svg{width:19px;height:19px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));z-index:80;
  background:var(--bezel);color:var(--bezel-ink);padding:13px 18px;border-radius:3px;font-size:16px;font-weight:500;
  border-left:4px solid var(--acc-fill);max-width:calc(100vw - 32px);text-align:left}
@media (min-width:1000px){.toast{bottom:26px}}
.linkrow{display:flex;flex-wrap:wrap;gap:8px}
.linkrow a{display:inline-flex;align-items:center;gap:8px;font-size:15.5px;font-weight:500;text-decoration:none;
  border:1px solid var(--rule-hard);border-radius:3px;padding:8px 12px;background:var(--panel);color:var(--ink-2)}
.linkrow a:hover{border-color:var(--acc-fill);color:var(--acc)}
.linkrow a>svg{width:17px;height:17px}
.check{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--rule-2)}
.check:last-child{border-bottom:0}
.check .bx{width:26px;height:26px;border-radius:2px;border:1px solid var(--rule-hard);flex:none;display:grid;
  place-items:center;background:var(--raised)}
.check .bx>svg{width:15px;height:15px}
.check.done .bx{background:var(--good);border-color:var(--good);color:var(--panel)}
.check.done .t{color:var(--muted);text-decoration:line-through}
.check .grow{flex:1;min-width:0}
.check .t{font-weight:600;font-size:17.5px}
.check .s{font-size:16px;color:var(--muted);line-height:1.5}
</style>
</head>

  function prepare(code) {

    return crypto.subtle.digest('SHA-256', enc.encode('kitted-lab-id|' + code)).then(function (d) {
      var id = hex(d);
      return crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']).then(function (base) {

        if (!mine) { adoptRemote(theirs, theirVersion); setSyncState('ok'); render(); return; }

  /* ============================== INVOICES ==============================
     An invoice belongs to a job. It is seeded from what the job already
     knows -- who, what car, which services, what was agreed -- and then it
     is yours to edit. Nothing is invented: no number is burned until you
     actually raise one.
     ===================================================================== */
  function biz() { if (!S.meta.biz) S.meta.biz = {}; return S.meta.biz; }
  function padNo(x, w) {
    var v = String(Math.max(1, Math.floor(n(x) || 1)));
    while (v.length < (w || 4)) v = '0' + v;
    return v;
  }
  function nextInvNo() {
    var b = biz();
    return (b.prefix == null ? 'INV-' : b.prefix) + padNo(S.meta.invNext || 1, n(b.numWidth) || 4);
  }
  /** You type the whole next number, the way it should read. The trailing
      digits are the count, everything in front of them is the prefix, and how
      many digits you typed is how wide it stays. */
  function setNextNo(v) {
    var b = biz(), str = String(v == null ? '' : v).trim();
    var m = str.match(/^(.*?)(\d+)$/);
    if (m) {
      b.prefix = m[1];
      b.numWidth = m[2].length;
      S.meta.invNext = Math.max(1, parseInt(m[2], 10) || 1);
    } else {
      b.prefix = str;
    }
  }
  function addDays(iso, d) {
    var t = new Date(iso + 'T00:00:00');
    if (isNaN(t.getTime())) return iso;
    t.setDate(t.getDate() + (n(d) || 0));
    return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
  }
  function invJob(inv) { return inv ? byId(S.jobs, inv.jobId) : null; }
  function invOfJob(id) {
    for (var i = 0; i < S.invoices.length; i++) if (S.invoices[i].jobId === id) return S.invoices[i];
    return null;
  }
  function invPaid(inv) { var j = invJob(inv); return !!j && j.status === 'Paid'; }
  function unsentInvoices() {
    return S.invoices.filter(function (v) { var j = invJob(v); return !v.sent && (!j || j.status !== 'Cancelled'); });
  }
  function unpaidInvoices() {
    return S.invoices.filter(function (v) { var j = invJob(v); return j && j.status !== 'Paid' && j.status !== 'Cancelled'; });
  }

  /** Build the first draft from a job. Fixed-price services become their own
      lines; whatever is left over against the agreed price becomes one more,
      named after the per-job work if there is any. */
  function seedLines(j) {
    var lines = [], fixed = 0, quotes = [];
    (j.serviceIds || []).forEach(function (id) {
      var sv = svc(id);
      if (!sv) return;
      if (svcMode(sv) === 'varies') { quotes.push(sv.name); return; }
      if (n(sv.price) > 0) { lines.push({ desc: sv.name, qty: 1, each: n(sv.price) }); fixed += n(sv.price); }
      else quotes.push(sv.name);
    });
    var rest = Math.round((n(j.price) - fixed) * 100) / 100;
    if (!lines.length) return [{ desc: quotes.length ? quotes.join(' + ') : jobTitle(j), qty: 1, each: n(j.price) }];
    if (Math.abs(rest) >= 0.01) lines.push({ desc: quotes.length ? quotes.join(' + ') : 'Extra work agreed', qty: 1, each: rest });
    return lines;
  }

  /** Raise one against a job, burning the next number as it goes. */
  function raiseInvoice(job, lines) {
    var inv = {
      id: uid('iv'), jobId: job.id, no: nextInvNo(), date: todayISO(),
      due: addDays(todayISO(), n(biz().terms) || 14),
      lines: lines || seedLines(job), note: '', sent: false
    };
    S.invoices.push(inv);
    S.meta.invNext = (n(S.meta.invNext) || 1) + 1;
    return inv;
  }

  function invTotal(inv) {
    return Math.round((inv.lines || []).reduce(function (a, l) { return a + n(l.qty) * n(l.each); }, 0) * 100) / 100;
  }
  function invTotals(inv) {
    var b = biz(), j = invJob(inv), total = invTotal(inv);
    var rate = b.gst ? (n(b.gstRate) || 10) : 0;
    var gst = rate ? Math.round((total - total / (1 + rate / 100)) * 100) / 100 : 0;
    var dep = j ? Math.min(n(j.deposit), total) : 0;
    return { total: total, gst: gst, ex: Math.round((total - gst) * 100) / 100, rate: rate,
             dep: dep, due: Math.round((total - dep) * 100) / 100 };
  }

  /** The sheet itself. Same markup on screen and in the saved file, so what
      is printed is exactly what was looked at. */
  function invoiceSheet(inv) {
    var j = invJob(inv) || {}, b = biz(), t = invTotals(inv), paid = invPaid(inv);
    var br = function (x) { return esc(x).replace(/\n+/g, '<br>'); };   // the name is already the heading
    var who = [b.abn ? 'ABN ' + b.abn : '', b.addr, b.phone, b.email].filter(Boolean).map(br).join('<br>');
    var bill = [j.customer || 'Customer', j.phone, j.car, j.rego ? 'Rego ' + j.rego : '']
      .filter(Boolean).map(br).join('<br>');
    var pay = [b.bank, b.bsb ? 'BSB ' + b.bsb : '', b.acct ? 'Acct ' + b.acct : '']
      .filter(Boolean).map(br).join('<br>');

    var rows = (inv.lines || []).map(function (l) {
      return '<tr><td>' + esc(l.desc || '') + '</td><td class="q">' + esc(qtyStr(l.qty)) + '</td>' +
        '<td class="m">' + money2(l.each) + '</td><td class="m">' + money2(n(l.qty) * n(l.each)) + '</td></tr>';
    }).join('');

    var sums = '';
    if (t.rate) {
      sums += '<tr><td>Subtotal</td><td class="m">' + money2(t.ex) + '</td></tr>' +
        '<tr><td>GST ' + t.rate + '%</td><td class="m">' + money2(t.gst) + '</td></tr>';
    }
    sums += '<tr class="big"><td>Total</td><td class="m">' + money2(t.total) + '</td></tr>';
    if (paid) {
      sums += '<tr><td>Paid in full</td><td class="m">' + money2(t.total) + '</td></tr>' +
        '<tr class="big"><td>Nothing owing</td><td class="m">' + money2(0) + '</td></tr>';
    } else if (t.dep > 0) {
      sums += '<tr><td>Deposit already paid</td><td class="m">−' + money2(t.dep) + '</td></tr>' +
        '<tr class="big"><td>Amount due</td><td class="m">' + money2(t.due) + '</td></tr>';
    }

    var name = b.legal || S.meta.business || 'Kitted Lab';
    var mark = b.logo
      ? '<img class="pap-logo" src="' + esc(b.logo) + '" alt="' + esc(name) + '">' +
        '<div class="pap-name sm">' + esc(name) + '</div>'
      : '<div class="pap-name">' + esc(name) + '</div>';
    var when = paid
      ? '<div class="pap-lab">Paid on</div><div>' + esc(fullDate(j.paidOn || inv.date) || inv.date) + '</div>' +
        (j.paidHow ? '<div class="pap-lab" style="margin-top:9px">How</div><div>' + esc(j.paidHow) + '</div>' : '')
      : '<div class="pap-lab">Date</div><div>' + esc(fullDate(inv.date) || inv.date) + '</div>' +
        '<div class="pap-lab" style="margin-top:9px">Due</div><div>' + esc(fullDate(inv.due) || inv.due) + '</div>';

    return '<div class="paper' + (paid ? ' is-paid' : '') + '"><div class="pap-h">' +
      '<div class="pap-id">' + mark +
      '<div class="pap-sub">' + who + '</div></div>' +
      '<div class="pap-t"><div class="pap-word">' + (paid ? 'Receipt' : 'Tax invoice') + '</div>' +
      '<div class="pap-no">' + esc(inv.no) + '</div>' +
      (paid ? '<div class="pap-paid">Paid — thank you</div>' : '') + '</div></div>' +
      '<div class="pap-cols">' +
      '<div><div class="pap-lab">' + (paid ? 'Receipt for' : 'Bill to') + '</div><div>' + bill + '</div></div>' +
      '<div>' + when + '</div>' +
      '</div>' +
      '<table class="pap-tab"><thead><tr><th>What for</th><th class="q">Qty</th>' +
      '<th class="m">Each</th><th class="m">Amount</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="pap-foot"><div class="pap-pay">' +
      (pay && !paid ? '<div class="pap-lab">How to pay</div><div>' + pay + '</div>' : '') +
      (inv.note ? '<div class="pap-lab" style="margin-top:11px">Note</div><div>' + br(inv.note) + '</div>' : '') +
      '</div><table class="pap-sum"><tbody>' + sums + '</tbody></table></div>' +
      (b.footer ? '<div class="pap-end">' + br(b.footer) + '</div>' : '') +
      '</div>';
  }

  /* One source for how an invoice looks. The app injects it at boot; the
     saved file carries a copy inside itself, so both always match. */
  var PAPER_CSS = [
    '.paper{max-width:800px;margin:0 auto;background:#fff;color:#141A17;border:1px solid #d9ded8;',
    '  border-radius:3px;padding:38px 40px 34px;box-shadow:0 1px 3px rgba(0,0,0,.07);',

    '.paper .pap-h{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;',
    '  border-bottom:2px solid #141A17;padding-bottom:18px}',

    '.paper .pap-name.sm{font-size:16px;font-weight:600;margin-bottom:4px}',

    '.paper .pap-no{font-family:"Roboto Mono",ui-monospace,monospace;font-size:21px;font-weight:600;margin-top:3px}',
    '.paper .pap-paid{margin-top:7px;display:inline-block;border:1.5px solid #197A4B;color:#197A4B;',
    '  border-radius:3px;padding:3px 9px;font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}',
    '.paper .pap-cols{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;margin:22px 0 26px}',
    '.paper .pap-lab{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;',

    '.paper table{width:100%;border-collapse:collapse}',
    '.paper .pap-tab th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;',

    '.paper .pap-foot{display:flex;justify-content:space-between;gap:34px;flex-wrap:wrap;margin-top:24px}',
    '.paper .pap-pay{max-width:44%;min-width:200px;font-size:14.5px}',
    '.paper .pap-sum{width:290px;flex:none}',
    '.paper .pap-sum td{padding:6px 0}',
    '.paper .pap-sum td.m{text-align:right;font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}',
    '.paper .pap-sum tr.big td{font-size:19px;font-weight:700;border-top:1px solid #141A17;padding-top:10px}',
    '.paper .pap-end{margin-top:30px;padding-top:14px;border-top:1px solid #e7eae5;',
    '  color:#5F6B65;font-size:14px}',
    '@media (max-width:640px){',
    '  .paper{padding:24px 20px}',
    '  .paper .pap-sum{width:100%}',
    '  .paper .pap-pay{max-width:100%}',
    '  .paper .pap-h{flex-direction:column;gap:16px}',      /* the two halves stop fighting */
    '  .paper .pap-t{text-align:left}',
    '  .paper .pap-logo{max-width:190px;max-height:58px}',
    '  .paper .pap-cols{gap:18px}',
    '}'
  ].join('\n');
  try {
    document.head.insertAdjacentHTML('beforeend', '<style id="paper-css">' + PAPER_CSS + '</style>');
  } catch (e) {}

  var INVOICE = null;
  /** Open the invoice for a job, raising one first if it has none. */
  function invoiceJob(jobId) {
    var j = byId(S.jobs, jobId);
    if (!j) return;
    var inv = invOfJob(jobId);
    if (!inv) { inv = raiseInvoice(j); touch(); }
    openInvoice(inv.id);
  }
  function openInvoice(id) {
    if (!byId(S.invoices, id)) return;
    INVOICE = id;
    renderInvoice();
  }
  function closeInvoice() { INVOICE = null; document.getElementById('layer').innerHTML = ''; render(); }
  function renderInvoice() {
    var inv = byId(S.invoices, INVOICE);
    if (!inv) return closeInvoice();
    var j = invJob(inv) || {};
    document.getElementById('layer').innerHTML =
      '<div class="invwrap"><div class="invbar">' +
      '<button class="btn icon ghost" data-act="inv-close" aria-label="Close">' + ico('x') + '</button>' +
      '<strong class="truncate">' + esc(inv.no) + ' · ' + esc(j.customer || 'Customer') + '</strong>' +
      '<div class="spacer"></div>' +
      '<button class="btn sm" data-act="inv-edit">' + ico('pencil') + 'Change it</button>' +
      '<button class="btn sm" data-act="inv-email">' + ico('mail') + 'Email it</button>' +
      '<button class="btn sm" data-act="inv-save-file">' + ico('down') + 'Save a copy</button>' +
      '<button class="btn sm primary" data-act="inv-print">' + ico('print') + 'Print</button>' +
      (inv.sent ? '' : '<button class="btn sm ok" data-act="inv-sent">' + ico('check') + 'Mark as sent</button>') +
      (j.id && j.status !== 'Paid' && inv.sent
        ? '<button class="btn sm ok" data-act="inv-paid">' + ico('money') + 'They paid it</button>' : '') +
      '</div><div class="invpage">' + invoiceSheet(inv) + '</div></div>';
  }

  /** A standalone file: the sheet plus the styles it needs, nothing else.
      Opens and prints anywhere, with no trace of the app around it. */
  function invoiceFile(inv) {
    var j = invJob(inv) || {};
    return '<!doctype html><html lang="en"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>' + esc(inv.no + ' ' + (j.customer || '')) + '</title><style>' + PAPER_CSS +
      'body{margin:0;background:#f4f4f2;padding:22px;font-family:Barlow,-apple-system,BlinkMacSystemFont,' +
      '"Segoe UI",Roboto,sans-serif;color:#141A17}' +
      '@media print{body{background:#fff;padding:0}.paper{box-shadow:none;border:0;margin:0}}' +
      '</style></head><body>' + invoiceSheet(inv) + '</body></html>';
  }

  /* ---------------------------------------------- writing one from scratch */
  /** An invoice is one car and one price, which is exactly what a job is. So
      writing one straight out creates the job behind it and the numbers keep
      adding up on their own. */
  var NEWDOC = 'invoice';
  function openNewInvoice(kind) {
    INVOICE = null;                       // a new one, not a drawer over an old one
    NEWDOC = kind === 'receipt' ? 'receipt' : 'invoice';
    var rc = NEWDOC === 'receipt';
    drawer(rc ? 'Write a receipt' : 'Write an invoice',
      '<div class="hint" style="margin-bottom:15px">' + (rc
        ? 'For something already paid for. It puts the job on your Jobs page as paid, so the money counts itself.'
        : 'This also puts the job on your Jobs page, so the money counts itself.') + '</div>' +
      '<div class="fgrid">' +
      '<div class="field full"><label for="ni_customer">Who is it for? *</label>' +
      '<input class="inp" id="ni_customer" placeholder="Jamie Nguyen"></div>' +
      '<div class="field"><label for="ni_phone">Their phone</label><input class="inp" type="tel" id="ni_phone"></div>' +
      '<div class="field"><label for="ni_car">Car</label><input class="inp" id="ni_car" placeholder="2019 Toyota GR86"></div>' +
      '<div class="field"><label for="ni_rego">Rego</label><input class="inp" id="ni_rego"></div>' +
      '<div class="field"><label for="ni_date">' + (rc ? 'Paid on' : 'Dated') + '</label>' +
      '<input class="inp" type="date" id="ni_date" value="' + todayISO() + '"></div>' +
      '<div class="field full"><label for="ni_email">Their email</label>' +
      '<input class="inp" type="email" id="ni_email" placeholder="so you can send it to them"></div>' +
      (rc ? '<div class="field full"><label>How did they pay?</label>' +
        '<div class="pick">' + PAY_WAYS.map(function (w, i) {
          return '<button type="button" data-act="pay-way" data-v="' + esc(w) + '" aria-pressed="' + (i === 0) + '">' + esc(w) + '</button>';
        }).join('') + '</div></div>' : '') +
      '</div>' +
      '<div class="field full" style="margin-top:15px"><label>What you are charging for</label>' +
      '<div class="linebox"><div id="ivlines">' +
      invLineRow(null) + '</div>' +
      '<button type="button" class="btn sm" data-act="iv-add" style="align-self:flex-start">' + ico('plus') + 'Add a line</button>' +
      '</div>' + pickHint() + servicePicks() + '</div>' +
      '<div class="field full"><label for="ni_note">Anything to add</label>' +
      '<textarea class="inp" id="ni_note" rows="2" placeholder="Thanks for your business"></textarea></div>' +
      '<div class="keep" id="ivtotal"></div>',
      '<button class="btn ghost" data-act="close">Cancel</button><div class="spacer"></div>' +
      '<button class="btn primary" data-act="ni-save">' + ico('doc') +
      (rc ? 'Make the receipt' : 'Make the invoice') + '</button>');
    invRunning();
  }
  function pickHint() {
    var live = S.services.filter(function (sv) { return offered(sv) && n(sv.price) > 0; });
    return '<div class="hint">' + (live.length
      ? 'Tap one of your prices below, or write it yourself.'
      : 'Write whatever you are charging for. Set your prices in Settings and they turn up here as buttons.') + '</div>';
  }

  /** The total, live, so there is never a surprise at the bottom of the page. */
  function invRunning() {
    var box = document.getElementById('ivtotal');
    if (!box) return;
    var lines = readInvLines(), b = biz();
    var total = Math.round(lines.reduce(function (a, l) { return a + n(l.qty) * n(l.each); }, 0) * 100) / 100;
    var rate = b.gst ? (n(b.gstRate) || 10) : 0;
    var gst = rate ? Math.round((total - total / (1 + rate / 100)) * 100) / 100 : 0;
    box.innerHTML = '<div class="kr' + (rate ? '' : ' tot') + '"><span>' +
      (rate ? 'Subtotal' : 'This invoice comes to') + '</span><span class="num">' +
      money2(rate ? total - gst : total) + '</span></div>' +
      (rate ? '<div class="kr"><span>GST ' + rate + '%</span><span class="num">' + money2(gst) + '</span></div>' +
        '<div class="kr tot"><span>This invoice comes to</span><span class="num">' + money2(total) + '</span></div>' : '');
  }

  /** One tap to drop a priced service onto the invoice. */
  function servicePicks() {
    var live = S.services.filter(function (sv) { return offered(sv) && n(sv.price) > 0; });
    if (!live.length) return '';
    return '<div class="picks">' + live.slice(0, 10).map(function (sv) {
      return '<button type="button" class="pick-b" data-act="iv-pick" data-v="' + esc(sv.id) + '">' +
        esc(sv.name) + ' <span class="num">' + money(sv.price) + '</span></button>';
    }).join('') + '</div>';
  }
  function readInvLines() {
    var host = document.querySelector('.drawer-b'), lines = [];
    if (!host) return lines;
    host.querySelectorAll('.itemline.inv').forEach(function (row) {
      var o = {};
      row.querySelectorAll('[data-vk]').forEach(function (el) { o[el.getAttribute('data-vk')] = el.value; });
      if (String(o.desc || '').trim()) lines.push({ desc: String(o.desc).trim(), qty: n(o.qty) || 1, each: n(o.each) });
    });
    return lines;
  }
  function saveNewInvoice() {
    var who = String((document.getElementById('ni_customer') || {}).value || '').trim();
    if (!who) { toast('Put in who it is for first.'); var e = document.getElementById('ni_customer'); if (e) e.focus(); return; }
    var lines = readInvLines();
    if (!lines.length) { toast('Put in at least one thing you are charging for.'); return; }
    var total = lines.reduce(function (a, l) { return a + n(l.qty) * n(l.each); }, 0);
    var date = document.getElementById('ni_date').value || todayISO();
    var rc = NEWDOC === 'receipt';
    var picked = document.querySelector('.pick [data-act="pay-way"][aria-pressed="true"]');
    var price = Math.round(total * 100) / 100;
    var job = {
      id: uid('jb'), customer: who,
      phone: String(document.getElementById('ni_phone').value || '').trim(),
      email: String(document.getElementById('ni_email').value || '').trim(),
      car: String(document.getElementById('ni_car').value || '').trim(),
      rego: String(document.getElementById('ni_rego').value || '').trim(),
      date: date, serviceIds: [], price: price,
      status: rc ? 'Paid' : 'Done', deposit: rc ? price : 0,
      paidOn: rc ? date : '', paidHow: rc && picked ? picked.getAttribute('data-v') : '',
      materials: 0, parts: [], notes: ''
    };
    S.jobs.push(job);
    var inv = raiseInvoice(job, lines);
    inv.date = date;
    inv.due = addDays(date, n(biz().terms) || 14);
    inv.note = String(document.getElementById('ni_note').value || '').trim();
    if (rc) inv.sent = true;                 // a receipt is handed over on the spot
    closeDrawer(); touch(); render();
    openInvoice(inv.id);
    toast(inv.no + ' is ready.');
  }

  /** The document as plain words, so it reads properly in any mail app —
      no attachment needed for the customer to see what they are paying. */
  function emailBody(inv) {
    var j = invJob(inv) || {}, b = biz(), t = invTotals(inv), paid = invPaid(inv);
    var name = b.legal || S.meta.business || 'Kitted Lab';
    var first = String(j.customer || '').trim().split(/\s+/)[0];
    var L = [];
    L.push(first ? 'Hi ' + first + ',' : 'Hi,');
    L.push('');
    L.push(paid ? 'Thanks — here is your receipt from ' + name + '.'
                : 'Here is your invoice from ' + name + '.');
    L.push('');
    L.push((paid ? 'Receipt ' : 'Invoice ') + inv.no + '  ·  ' + (fullDate(inv.date) || inv.date));
    if (j.car) L.push(j.car + (j.rego ? '  ·  ' + j.rego : ''));
    L.push('');
    (inv.lines || []).forEach(function (l) {
      var q = n(l.qty);
      L.push('- ' + (l.desc || '') + (q > 1 ? '  ' + qtyStr(q) + ' \u00d7 ' + money2(l.each) : '') +
        '   ' + money2(q * n(l.each)));
    });
    L.push('');
    if (t.rate) {
      L.push('Subtotal   ' + money2(t.ex));
      L.push('GST ' + t.rate + '%     ' + money2(t.gst));
    }
    L.push('Total      ' + money2(t.total));
    if (paid) {
      L.push('Paid       ' + (fullDate(j.paidOn || inv.date) || '') + (j.paidHow ? ' by ' + j.paidHow.toLowerCase() : ''));
      L.push('Owing      ' + money2(0));
    } else {
      if (t.dep > 0) {
        L.push('Deposit    -' + money2(t.dep));
        L.push('To pay     ' + money2(t.due));
      }
      L.push('');
      L.push('Due by ' + (fullDate(inv.due) || inv.due) + '.');
      if (b.bank || b.bsb || b.acct) {
        L.push('');
        L.push('How to pay');
        if (b.bank) L.push(b.bank);
        if (b.bsb) L.push('BSB ' + b.bsb);
        if (b.acct) L.push('Acct ' + b.acct);
      }
    }
    if (inv.note) { L.push(''); L.push(inv.note); }
    L.push('');
    L.push('Thanks,');
    L.push(name);
    if (b.phone) L.push(b.phone);
    if (b.email) L.push(b.email);
    return L.join('\n');
  }
  function emailSubject(inv) {
    var name = biz().legal || S.meta.business || 'Kitted Lab';
    return (invPaid(inv) ? 'Receipt ' : 'Invoice ') + inv.no + ' from ' + name;
  }

  function openEmail(id) {
    var inv = byId(S.invoices, id);
    if (!inv) return;
    var j = invJob(inv) || {};
    drawer(invPaid(inv) ? 'Email the receipt' : 'Email the invoice',
      '<div class="fgrid">' +
      '<div class="field full"><label for="em_to">Send it to</label>' +
      '<input class="inp" type="email" id="em_to" value="' + esc(j.email || '') + '" placeholder="them@example.com"></div>' +
      '<div class="field full"><label for="em_sub">Subject</label>' +
      '<input class="inp" id="em_sub" value="' + esc(emailSubject(inv)) + '"></div>' +
      '</div>' +
      '<div class="field full"><label for="em_body">Message</label>' +
      '<textarea class="inp" id="em_body" rows="14" style="font-family:\'Roboto Mono\',ui-monospace,monospace;font-size:14.5px">' +
      esc(emailBody(inv)) + '</textarea></div>' +
      '<div class="hint">The whole thing is written out in the message, so they can read it without opening anything. ' +
      'Want the printed one as well? Close this and press Save a copy, then attach that file.</div>',
      '<button class="btn ghost" data-act="close">Close</button><div class="spacer"></div>' +
      '<button class="btn" data-act="em-copy">Copy the message</button>' +
      '<button class="btn primary" data-act="em-open" data-id="' + inv.id + '">' + ico('mail') + 'Open my email</button>');
  }
  function sendEmail(id) {
    var inv = byId(S.invoices, id);
    if (!inv) return;
    var to = String((document.getElementById('em_to') || {}).value || '').trim();
    var sub = String((document.getElementById('em_sub') || {}).value || '');
    var body = String((document.getElementById('em_body') || {}).value || '');
    var url = 'mailto:' + encodeURIComponent(to) +
      '?subject=' + encodeURIComponent(sub) + '&body=' + encodeURIComponent(body);
    var j = invJob(inv);
    if (j && to && to !== j.email) { j.email = to; touch(); }
    var a = document.createElement('a');
    a.href = url; a.style.display = 'none';
    document.body.appendChild(a);
    try { a.click(); } catch (e) {}
    a.remove();
    toast('Opening your email app. If nothing happens, copy the message instead.');
  }

  function openInvoiceEdit(id) {
    var inv = byId(S.invoices, id);
    if (!inv) return;
    drawer('Change the invoice',
      '<div class="fgrid">' +
      '<div class="field"><label for="iv_no">Invoice number</label>' +
      '<input class="inp" id="iv_no" value="' + esc(inv.no) + '"></div>' +
      '<div class="field"><label for="iv_date">Dated</label>' +
      '<input class="inp" type="date" id="iv_date" value="' + esc(inv.date) + '"></div>' +
      '<div class="field"><label for="iv_due">Due by</label>' +
      '<input class="inp" type="date" id="iv_due" value="' + esc(inv.due) + '"></div>' +
      '</div>' +
      '<div class="field full" style="margin-top:15px"><label>What you are charging for</label>' +
      '<div class="linebox"><div id="ivlines">' + (inv.lines || []).map(invLineRow).join('') + '</div>' +
      '<button type="button" class="btn sm" data-act="iv-add" style="align-self:flex-start">' + ico('plus') + 'Add a line</button>' +
      '</div><div class="hint">Write it however you want it read. This is what the customer sees.</div>' +
      servicePicks() + '</div>' +
      '<div class="field full"><label for="iv_note">Anything to add</label>' +
      '<textarea class="inp" id="iv_note" rows="2" placeholder="Thanks for your business">' + esc(inv.note || '') + '</textarea></div>' +
      '<div class="keep" id="ivtotal"></div>',
      '<button class="btn ghost" data-act="close">Cancel</button><div class="spacer"></div>' +
      '<button class="btn primary" data-act="iv-save" data-id="' + inv.id + '">' + ico('check') + 'Save</button>');
    invRunning();
  }
  function invLineRow(l) {
    l = l || { desc: '', qty: 1, each: '' };
    return '<div class="itemline inv">' +
      '<input class="inp full2" data-vk="desc" value="' + esc(l.desc || '') + '" placeholder="What for" aria-label="What for">' +
      '<input class="inp" type="number" step="1" min="0" inputmode="numeric" data-vk="qty" value="' + esc(l.qty) + '" placeholder="Qty" aria-label="How many">' +
      '<input class="inp" type="number" step="0.01" min="0" inputmode="decimal" data-vk="each" value="' + esc(l.each) + '" placeholder="Each" aria-label="Price each">' +
      '<button type="button" class="btn icon" data-act="iv-del" aria-label="Remove line">' + ico('x') + '</button></div>';
  }
  /** Dropping a priced service in fills the first empty line, or adds one. */
  function pickService(id) {
    var sv = svc(id), host = document.getElementById('ivlines');
    if (!sv || !host) return;
    var rows = host.querySelectorAll('.itemline.inv');
    var target = null;
    for (var i = 0; i < rows.length; i++) {
      if (!String(rows[i].querySelector('[data-vk="desc"]').value || '').trim()) { target = rows[i]; break; }
    }
    if (!target) {
      host.insertAdjacentHTML('beforeend', invLineRow(null));
      target = host.lastElementChild;
    }
    target.querySelector('[data-vk="desc"]').value = sv.name;
    target.querySelector('[data-vk="qty"]').value = 1;
    target.querySelector('[data-vk="each"]').value = n(sv.price);
  }
  function saveInvoiceEdit(id) {
    var inv = byId(S.invoices, id);
    if (!inv) return;
    var lines = readInvLines();
    if (!lines.length) { toast('An invoice needs at least one line.'); return; }
    inv.no = String(document.getElementById('iv_no').value || '').trim() || inv.no;
    inv.date = document.getElementById('iv_date').value || inv.date;
    inv.due = document.getElementById('iv_due').value || inv.due;
    inv.note = String(document.getElementById('iv_note').value || '').trim();
    inv.lines = lines;
    var j = invJob(inv);
    if (j && j.status !== 'Paid') j.price = invTotal(inv);   // keep the job in step
    closeDrawer(); touch(); renderInvoice(); toast('Invoice updated.');
  }

  /* ============================ CALENDAR ================================
     A month grid of the jobs board. Every day is tappable; a job on a day
     is tappable straight through to the job itself.
     ===================================================================== */
  var DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function longDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    return DAY[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear();
  }

  function viewCalendar() {
    var m = UI.month, y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1;
    var first = new Date(y, mo, 1);
    var lead = (first.getDay() + 6) % 7;          // grid starts on Monday
    var byDate = {};
    S.jobs.forEach(function (j) {
      if (!j.date) return;
      (byDate[j.date] || (byDate[j.date] = [])).push(j);
    });

    var cells = [], i;
    for (i = 0; i < 42; i++) cells.push(new Date(y, mo, 1 - lead + i));
    // drop a trailing week that belongs entirely to the next month
    if (cells[35].getMonth() !== mo) cells = cells.slice(0, 35);

    var today = todayISO();
    var h = DOW.map(function (d) { return '<div class="cal-head">' + d + '</div>'; }).join('');

    cells.forEach(function (d) {
      var iso = isoOf(d), list = sortBy(byDate[iso] || [], function (j) { return (j.customer || '').toLowerCase(); });
      var out = d.getMonth() !== mo;
      var take = list.slice(0, 3), rest = list.length - take.length;
      var value = list.reduce(function (a, j) { return a + n(j.price); }, 0);
      h += '<div class="cal-day' + (out ? ' out' : '') + (iso === today ? ' today' : '') + '" role="button" tabindex="0" ' +
        'data-act="cal-day" data-d="' + iso + '" aria-label="' + esc(longDate(iso)) + ', ' + plural(list.length, 'job') + '">' +
        '<span class="cal-num">' + d.getDate() + '</span>' +
        (list.length ? '<span class="cal-dots">' + list.slice(0, 6).map(function (j) {
          return '<span class="cal-dot ' + statusCls(j) + '"></span>';
        }).join('') + '</span>' : '') +
        take.map(function (j) {
          return '<span class="cal-pill ' + statusCls(j) + '" data-act="edit-job" data-id="' + j.id + '" ' +
            'title="' + esc((j.customer || 'No name') + ' — ' + jobTitle(j) + ' — ' + money(j.price)) + '">' +
            esc(j.customer || 'No name') + '</span>';
        }).join('') +
        (rest > 0 ? '<span class="cal-more">+' + rest + ' more</span>' : '') +
        (value ? '<span class="cal-money">' + esc(money(value)) + '</span>' : '') +
        '</div>';
    });

    return '<div class="cal">' + h + '</div>' +
      '<div class="legend" style="margin-top:12px">' +
      '<span><i style="background:var(--muted)"></i>Not started yet</span>' +
      '<span><i style="background:var(--s2)"></i>Car is in now</span>' +
      '<span><i style="background:var(--bad)"></i>Waiting on payment</span>' +
      '<span><i style="background:var(--good)"></i>Paid</span>' +
      '</div><div class="hint" style="margin-top:8px">Tap a day to see it, or tap a name to open that job.</div>';
  }

  function openDay(iso) {
    var list = sortBy(S.jobs.filter(function (j) { return j.date === iso; }), function (j) { return (j.customer || '').toLowerCase(); });
    var total = list.reduce(function (a, j) { return a + n(j.price); }, 0);
    var body;
    if (!list.length) {
      body = '<div class="empty">' + ico('car') + '<div class="body"><h3>Nothing on</h3>' +
        '<p>No cars booked in for this day.</p></div></div>';
    } else {
      body = '<div class="rows">' + list.map(function (j) {
        return '<div class="row tap" data-act="edit-job" data-id="' + j.id + '">' +
          '<span class="grow"><span class="t truncate">' + esc(j.customer || 'No name') + '</span>' +
          '<br><span class="s truncate">' + esc(j.car || 'Car not set') + ' · ' + esc(jobTitle(j)) + '</span></span>' +
          '<span style="text-align:right;flex:none">' + statusChip(j) +
          '<br><span class="s num">' + money(j.price) + '</span></span></div>';
      }).join('') + '</div>' +
        '<div class="row" style="border-top:1px solid var(--rule-hard)"><span class="grow"><span class="t">' +
        plural(list.length, 'job') + ' on this day</span></span><span class="num" style="font-weight:700">' +
        money(total) + '</span></div>';
    }
    drawer(longDate(iso), body,
      '<button class="btn ghost" data-act="close">Close</button><div class="spacer"></div>' +
      '<button class="btn primary" data-act="new-job-on" data-d="' + iso + '">' + ico('plus') + 'Book a job</button>');
    var b = document.querySelector('.drawer-b');
    if (b) b.className = 'drawer-b flush';
  }

  /* =============================== STOCK ================================ */
  function viewStock() {
    var low = lowStock(), out = S.products.filter(function (p) { return n(p.qty) <= 0; });
    var list = S.products.filter(function (p) {
      if (UI.stockFilter === 'low' && n(p.qty) > n(p.reorder)) return false;
      if (UI.stockFilter === 'out' && n(p.qty) > 0) return false;
      return hit([p.name, p.sku, p.category, supName(p.supplierId), p.location].join(' '));
    });
    list = sortBy(list, function (p) { return (p.name || '').toLowerCase(); });
    var sv = stockValue();

    var h = '<div class="toolbar">' + searchBar('Search stock…') +
      seg('stock-filter', [
        { v: 'all', l: 'All', n: S.products.length || '' },
        { v: 'low', l: 'Low', n: low.length || '' },
        { v: 'out', l: 'Out', n: out.length || '' }
      ], UI.stockFilter) +
      '<button class="btn primary" data-act="new-product">' + ico('plus') + 'Add item</button>' +
      '<button class="btn" data-act="paste" data-kind="products">' + ico('clip') + 'Paste a list</button></div>';

    if (!S.products.length) {
      h += '<section class="card">' + emptyBlock('box', 'No stock yet',
        'Tint film, wrap vinyl, polish, body kits, wheels — anything you count and pay for.',
        '<button class="btn primary big" data-act="new-product">' + ico('plus') + 'Add an item</button>' +
        '<button class="btn big" data-act="paste" data-kind="products">' + ico('clip') + 'Paste a list</button>') + '</section>';
    } else {
      h += '<div class="tiles" style="margin-bottom:16px;margin-top:0">' +
        tile('Items', S.products.length + '', qtyStr(sv.units) + ' on the shelf') +
        tile('What it cost you', money(sv.cost), 'Money sitting on the shelf') +
        tile('Low or out', low.length + '', out.length + ' completely out', 'stock') +
        tile('On the way', S.products.reduce(function (a, p) { return a + incomingQty(p.id); }, 0) + '', 'units on order') +
        '</div>';

      var byCat = {};
      S.products.forEach(function (p) {
        var k = p.category || 'No type';
        byCat[k] = (byCat[k] || 0) + n(p.qty) * n(p.cost);
      });
      var catRows = sortBy(Object.keys(byCat).map(function (k) { return { n: k, v: byCat[k] }; }), function (x) { return x.v; }, 'desc').slice(0, 7);

      h += perCarCard();
      h += '<div class="grid g2" style="margin-bottom:16px">';
      h += '<section class="card"><div class="card-h">' + ico('box') + '<h3>Where the money is sitting</h3></div>' +
        '<div class="card-b">' + hbars(catRows, sv.cost, { empty: 'Nothing costed yet.' }) + '</div></section>';
      h += '<section class="card"><div class="card-h">' + ico('truck') + '<h3>Coming in</h3><div class="spacer"></div>' +
        (S.orders.length ? '<button class="btn ghost sm" data-tab="orders">See all orders</button>' : '') +
        '</div><div class="card-b flush">' +
        (S.orders.filter(orderOpen).length
          ? '<div class="rows">' + sortBy(S.orders.filter(orderOpen), function (o) { return o.eta || '9999'; }).slice(0, 5).map(function (o) {
            var d = days(o.eta);
            return '<div class="row tap" data-act="edit-order" data-id="' + o.id + '">' +
              '<span class="grow"><span class="t truncate">' + esc(o.ref || 'Order') + ' · ' + esc(supName(o.supplierId) || 'No supplier') + '</span>' +
              '<br><span class="s truncate">' + plural(orderUnits(o), 'unit') + ' · ' + money(orderTotal(o)) + ' landed</span></span>' +
              '<span class="chip ' + (orderLate(o) ? 'bad' : d != null && d <= 7 ? 'amb' : 'acc') + '">' +
              (d == null ? 'No date' : d < 0 ? Math.abs(d) + 'd late' : d === 0 ? 'Today' : 'in ' + d + 'd') + '</span></div>';
          }).join('') + '</div>'
          : emptyBlock('truck', 'Nothing on order', 'Put an order in as soon as you place it.',
            '<button class="btn" data-act="new-order">' + ico('plus') + 'Add an order</button>')) +
        '</div></section></div>';

      if (!list.length) {
        h += '<section class="card">' + emptyBlock('search', 'Nothing here', 'Try another search or filter.') + '</section>';
      } else {
        h += '<section class="card"><div class="tablewrap"><table class="responsive"><thead><tr>' +
          '<th class="wcol">Item</th><th class="num">Left</th><th class="num">Coming</th>' +
          '<th class="num">Costs you</th><th class="num">Sell for</th><th></th></tr></thead><tbody>' +
          list.map(function (p) {
            var inc = incomingQty(p.id);
            return '<tr><td class="wide"><div class="rowtitle">' + esc(p.name) + '</div>' +
              '<div class="rowsub">' + (p.category ? esc(p.category) : 'No type') +
              (shared(p) ? ' · one does ' + carsStr(uses(p)) : '') +
              (p.supplierId ? ' · ' + esc(supName(p.supplierId)) : '') + (p.location ? ' · ' + esc(p.location) : '') + '</div></td>' +
              '<td class="num" data-l="Left">' + levelBar(p) +
              (shared(p) ? '<span class="sub2">' + qtyStr(p.qty) + ' on the shelf</span>' : '') + '</td>' +
              '<td class="num" data-l="Coming">' + (inc ? '<span class="chip acc">+' + inc + '</span>' : '—') + '</td>' +
              '<td class="num" data-l="Costs you">' + money2(shared(p) ? costPerCar(p) : p.cost) +
              (shared(p) ? '<span class="sub2">a car · ' + money2(p.cost) + ' the roll</span>' : '') + '</td>' +
              '<td class="num" data-l="Sell for">' + (n(p.price) ? money2(p.price) : '—') + '</td>' +

              '</div></td></tr>';
          }).join('') + '</tbody></table></div></section>';

    }

    return h;
  }

  /* ============================== ORDERS ================================
     Run exactly like jobs: a board across the top you can tap into, then
     cards you step forward one button at a time.
     ===================================================================== */
  function orderStage(o) {
    if (o.status === 'Arrived') return 'landed';
    if (o.status === 'Cancelled') return 'off';
    if (o.status === 'Ordered') return 'placed';
    return 'moving';
  }
  function nextOrderStep(o) {
    if (o.status === 'Ordered') return { v: 'On the way', l: 'It shipped' };
    return null;
  }
  function orderMoney(list) { return list.reduce(function (a, o) { return a + orderTotal(o); }, 0); }

  function orderBoard() {
    var placed = S.orders.filter(function (o) { return orderStage(o) === 'placed'; });
    var moving = S.orders.filter(function (o) { return orderStage(o) === 'moving'; });
    var landed = S.orders.filter(function (o) { return o.status === 'Arrived'; });
    var cell = function (cls, label, list, sub, filter) {
      return '<button class="stage ' + cls + '" data-act="order-filter" data-v="' + filter + '">' +
        '<div class="l">' + esc(label) + '</div><div class="n">' + list.length + '</div>' +
        '<div class="v">' + esc(sub) + '</div></button>';
    };
    return '<div class="stages three">' +
      cell('s-book', 'Not shipped yet', placed, money(orderMoney(placed)) + ' of it', 'placed') +
      cell('s-prog', 'On the way', moving, money(orderMoney(moving)) + ' of it', 'moving') +
      cell('s-paid', 'Landed', landed, plural(landed.length, 'order') + ' in', 'landed') +
      '</div>';
  }

  function viewOrders() {
    var f = UI.orderFilter || 'open';
    var list = S.orders.filter(function (o) {
      var st = orderStage(o);
      if (f === 'open' && !orderOpen(o)) return false;
      if (f === 'late' && !orderLate(o)) return false;
      if (['placed', 'moving', 'landed'].indexOf(f) >= 0 && st !== f) return false;
      return hit([o.ref, supName(o.supplierId), o.status, o.tracking, o.ship, o.notes].join(' '));
    });
    list = sortBy(list, function (o) { return (orderOpen(o) ? '0' : '1') + (o.eta || '9999'); });

    var h = '<div class="toolbar">' + searchBar('Search an order or supplier…') +
      seg('order-filter', [
        { v: 'open', l: 'On the way', n: S.orders.filter(orderOpen).length || '' },
        { v: 'late', l: 'Late', n: lateOrders().length || '' },
        { v: 'landed', l: 'Landed', n: '' },
        { v: 'all', l: 'All', n: '' }
      ], f) +
      '<button class="btn primary" data-act="new-order">' + ico('plus') + 'Put an order in</button>' +
      '<button class="btn" data-act="paste" data-kind="orders">' + ico('clip') + 'Paste a list</button></div>';

    if (!S.orders.length) {
      return h + '<section class="card">' + emptyBlock('truck', 'Nothing on order yet',
        'Put one in when you place it and you always know what is coming and when it lands.',
        '<button class="btn primary big" data-act="new-order">' + ico('plus') + 'Put your first order in</button>') + '</section>';
    }

    var open = S.orders.filter(orderOpen);
    var next = sortBy(open.filter(function (o) { return o.eta; }), function (o) { return o.eta; })[0];
    h += '<div class="tiles" style="margin-top:0">' +
      tile('Money on the water', money(orderMoney(open)), plural(open.length, 'order') + ' out there') +
      tile('Units coming', open.reduce(function (a, o) { return a + orderUnits(o); }, 0) + '', 'across every open order') +
      tile('Next to land', next ? esc(dLabel(next.eta)) : '—', next ? esc(next.ref || 'Order') + ' · ' + esc(supName(next.supplierId) || 'no supplier') : 'No dates set') +
      tile('Late', lateOrders().length + '', lateOrders().length ? 'past the date you expected' : 'everything is on time') +
      '</div>';

    h += secH('Where every order is at');
    h += orderBoard();
    h += '<div class="hint" style="margin-top:9px">Tap any of these to see those orders.</div>';

    if (!list.length) {
      var why = UI.q.trim()
        ? { h: 'Nothing matches "' + UI.q.trim() + '"', p: 'Try the order name or the supplier.' }
        : f === 'late' ? { h: 'Nothing is late', p: 'Everything on the way is still inside the date you expected.' }
          : f === 'landed' ? { h: 'Nothing has landed yet', p: 'Mark an order arrived and it turns up here.' }
            : { h: 'Nothing here', p: 'Try another tab above.' };
      return h + '<section class="card" style="margin-top:16px">' + emptyBlock('truck', why.h, why.p,
        '<button class="btn primary" data-act="new-order">' + ico('plus') + 'Put an order in</button>') + '</section>';
    }
    return h + '<div class="jobs" style="margin-top:16px">' + list.map(orderCard).join('') + '</div>';
  }

  /** How far through the wait an order is, so a 40-day sea shipment reads as
      "day 12 of 40" instead of a date that needs arithmetic. */
  function shipProgress(o) {
    if (!orderOpen(o) || !o.ordered || !o.eta) return '';
    var a = new Date(o.ordered + 'T00:00:00'), b = new Date(o.eta + 'T00:00:00');
    if (isNaN(a.getTime()) || isNaN(b.getTime())) return '';
    var total = Math.round((b - a) / 86400000);
    if (total <= 0) return '';
    var gone = Math.round((Date.now() - a) / 86400000);
    var pctDone = Math.max(0, Math.min(100, (gone / total) * 100));
    var late = gone > total;
    return '<div class="ship"><div class="ship-bar"><i class="' + (late ? 'late' : '') +
      '" style="width:' + pctDone.toFixed(1) + '%"></i></div>' +
      '<div class="ship-lab">' + (late ? 'day ' + gone + ', due on day ' + total :
        'day ' + Math.max(0, gone) + ' of about ' + total) + '</div></div>';
  }

  /** The sum written out in full: what the roll cost, how many cars it does,
      what that makes one car cost, and how many cars are left in it. */
  function perCarCard() {
    var list = S.products.filter(shared);
    if (!list.length) return '';
    list = sortBy(list, function (p) { return costPerCar(p); }, 'desc').slice(0, 8);
    return '<section class="card" style="margin-bottom:16px"><div class="card-h">' + ico('spark') +
      '<h3>What your materials cost you a car</h3></div><div class="card-b flush"><div class="rows">' +
      list.map(function (p) {
        return '<div class="row tap" data-act="edit-product" data-id="' + p.id + '">' +
          '<span class="grow"><span class="t truncate">' + esc(p.name) + '</span><br>' +
          '<span class="s truncate">' + money2(p.cost) + ' \u00f7 ' + carsStr(uses(p)) +
          ' \u00b7 ' + carsStr(carsLeft(p)) + ' left in it</span></span>' +
          '<span class="num" style="font-weight:600;text-align:right;flex:none">' + money2(costPerCar(p)) +
          '<span class="sub2" style="font-weight:400">a car</span></span></div>';
      }).join('') + '</div></div>' +
      '<div class="card-b"><div class="hint">Put one of these on a job and it charges the job that much, ' +
      'not the price of the whole roll. That is what makes the profit on a job real.</div></div></section>';
  }

  function orderCard(o) {
    var d = days(o.eta), late = orderLate(o);
    var cls = o.status === 'Arrived' ? 's-paid' : late ? 's-owed' : 's-book';
    var acts = '', step = nextOrderStep(o);
    if (step)
      acts += '<button class="btn sm" data-act="order-status" data-id="' + o.id + '" data-v="' + esc(step.v) + '">' + esc(step.l) + '</button>';
    if (orderOpen(o))
      acts += '<button class="btn sm primary" data-act="receive" data-id="' + o.id + '">' + ico('check') + 'It arrived</button>';
    acts += '<span class="spacer"></span>' +
      '<button class="btn icon sm" data-act="edit-order" data-id="' + o.id + '" aria-label="Edit order">' + ico('pencil') + '</button>' +
      '<button class="btn icon sm" data-act="del" data-kind="orders" data-id="' + o.id + '" aria-label="Delete order">' + ico('trash') + '</button>';
    return '<article class="job ' + cls + '"><div class="job-top" data-act="edit-order" data-id="' + o.id + '">' +
      '<div class="job-row1"><div class="job-who">' +
      '<div class="n">' + esc(o.ref || 'Order') + '</div>' +
      '<div class="c">' + esc(supName(o.supplierId) || 'No supplier') + '</div></div>' +
      '<div class="job-price">' + money(orderTotal(o)) + '</div></div>' +
      '<div class="job-meta">' +
      '<span class="chip ' + (o.status === 'Arrived' ? 'good' : late ? 'bad' : 'acc') + '">' + esc(o.status) + '</span>' +
      '<span class="job-when">' + (o.status === 'Arrived' ? 'Done' : d == null ? 'No date set' : d < 0 ? Math.abs(d) + ' days late' : d === 0 ? 'Due today' : 'in ' + d + ' days') + '</span>' +
      (o.ship ? '<span class="job-when">' + esc(o.ship) + '</span>' : '') +

    if (!S.expenses.length) {
      return h + '<section class="card">' + emptyBlock('wallet', 'Nothing logged yet',

      (r.ads ? meter(r.roas, 3, money(r.in) + ' in on ' + money(r.ads) + ' of ads') +
        '<div class="eyebrow" style="margin:16px 0 8px">Ad spend, last 6 months</div>' + chartHost('ads', 158)

      h += '<section class="card" style="margin-top:14px"><div class="tablewrap"><table class="responsive"><thead><tr>' +
        '<th>Date</th><th class="wcol">What for</th><th>Type</th><th class="num">Amount</th><th></th></tr></thead><tbody>' +
