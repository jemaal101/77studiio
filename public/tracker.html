  /* =============================== EXPORT =============================== */
  function csv(v) { var s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function toCSV(kind) {
    if (kind === 'orders') {
      var out = [['Order', 'Supplier', 'Status', 'Ordered', 'Expected', 'Item', 'Qty', 'Cost each', 'Line total', 'Freight', 'Duty', 'Notes'].map(csv).join(',')];
      S.orders.forEach(function (o) {
        var items = (o.items || []).length ? o.items : [{ productId: '', qty: 0, cost: 0 }];
        items.forEach(function (it, i) {
          out.push([o.ref, supName(o.supplierId), o.status, o.ordered, o.eta, it.productId ? prodName(it.productId) : '',
            n(it.qty), n(it.cost), n(it.qty) * n(it.cost), i ? '' : n(o.freight), i ? '' : n(o.duties), i ? '' : o.notes].map(csv).join(','));
        });
      });
      return out.join('\n');
    }
    var fields = KIND[kind].fields.filter(function (f) { return f.t !== 'lines'; });
    var head = fields.map(function (f) { return csv(f.l); });
    if (kind === 'jobs') head = head.concat(['Parts cost', 'Total cost', 'Profit', 'Still owed']);
    var rows = [head.join(',')];
    S[kind].forEach(function (r) {
      var line = fields.map(function (f) {
        var v = r[f.k];
        if (f.k === 'supplierId') v = supName(v);
        if (f.t === 'services') v = (v || []).map(svcName).filter(Boolean).join(' + ');
        return csv(v);
      });
      if (kind === 'jobs') line = line.concat([partsCost(r), jobCost(r), jobProfit(r), r.status === 'Paid' ? 0 : jobOwing(r)].map(csv));
      rows.push(line.join(','));
    });
    return rows.join('\n');
  }
  function exportKind(kind) {
    if (kind === 'backup') offerFile('kitted-lab-backup-' + todayISO() + '.json', JSON.stringify(S, null, 2));
    else offerFile('kitted-lab-' + kind + '-' + todayISO() + '.csv', toCSV(kind));
  }
  function offerFile(name, text) {
    if (DOWNLOADS) {
      DOWNLOADS.save({ filename: name, data: text }).then(function () { toast('Saved to your device.'); })
        .catch(function (e) { if (!e || e.code !== 'declined') showText(name, text); });
      return;
    }
    if (window.claude && window.claude.use) return showText(name, text);
    try {
      var url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
      var a = document.createElement('a');
      a.href = url; a.download = name; a.style.display = 'none';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      toast('Downloaded ' + name);
    } catch (e) { showText(name, text); }
  }
  function showText(name, text) {
    drawer('Copy ' + name,
      '<div class="hint">Downloads are not available here. Select all of this and paste it into a file or a spreadsheet.</div>' +
      '<textarea class="inp" id="copytext" rows="14" readonly>' + esc(text) + '</textarea>',
      '<button class="btn ghost" data-act="close">Close</button><div class="spacer"></div>' +
      '<button class="btn primary" data-act="copy-all">Select it all</button>');
  }
  function openImportJson() {
    drawer('Put a backup back',
      '<div class="hint">Paste in a backup file. Everything in here now gets replaced.</div>' +
      '<textarea class="inp" id="jsonin" rows="12" placeholder="{ … }"></textarea>',
      '<button class="btn ghost" data-act="close">Cancel</button><div class="spacer"></div>' +
      '<button class="btn danger" data-act="restore">Replace everything</button>');
  }

  /* =============================== RENDER =============================== */
  var VIEWS = { home: viewHome, jobs: viewJobs, stock: viewStock, money: viewMoney, contacts: viewContacts, settings: viewSettings };
  function render() {
    var wasSearch = document.activeElement && document.activeElement.id === 'q';
    document.getElementById('app').innerHTML = conflictBanner() + (VIEWS[UI.tab] || viewHome)();
    renderChrome();
    drawCharts();
    if (wasSearch) {
      var q = document.getElementById('q');
      if (q) { q.focus(); try { q.setSelectionRange(q.value.length, q.value.length); } catch (e) {} }
    }
  }
  function applyTheme() {
    var t = S.meta.theme || 'system';
    if (t === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }
  function setTab(id) {
    UI.tab = id; UI.q = '';
    try { sessionStorage.setItem('kl.ui', JSON.stringify(UI)); } catch (e) {}
    window.scrollTo(0, 0);
    closeDrawer(); render();
  }

  /** Keep the price in step with the services picked, unless it has been typed over. */
  function syncPrice() {
    var hidden = document.getElementById('f_serviceIds'), price = document.getElementById('f_price');
    if (!hidden || !price || !FORM) return;
    var ids = hidden.value.split(',').filter(Boolean);
    var sum = 0, matCost = 0;
    ids.forEach(function (id) { var sv = svc(id); if (sv) { sum += n(sv.price); matCost += n(sv.cost); } });
    if (n(price.value) === n(FORM.autoPrice) || !n(price.value)) price.value = sum || '';
    FORM.autoPrice = sum;
    var mat = document.getElementById('f_materials');
    if (mat && (!n(mat.value) || n(mat.value) === n(FORM.autoMat))) mat.value = matCost || '';
    FORM.autoMat = matCost;
  }

  /* ---------------------------- chart read-out --------------------------- */
  var TIP = null;
  function hideTip() { if (TIP) { TIP.remove(); TIP = null; } }
  function moveTip(ev) {
    if (!TIP) return;
    var pad = 14, w = TIP.offsetWidth, h = TIP.offsetHeight;
    var x = Math.min(window.innerWidth - w - 8, Math.max(8, ev.clientX + pad));
    var y = ev.clientY - h - pad;
    if (y < 8) y = ev.clientY + pad;
    TIP.style.left = x + 'px'; TIP.style.top = y + 'px';
  }
  document.addEventListener('mouseover', function (ev) {
    var t = ev.target;
    if (!t.getAttribute || !t.getAttribute('data-tip')) return;
    hideTip();
    TIP = document.createElement('div');
    TIP.className = 'charttip';
    TIP.innerHTML = t.getAttribute('data-tip');
    document.body.appendChild(TIP);
    moveTip(ev);
  });
  document.addEventListener('mousemove', function (ev) {
    if (!TIP) return;
    if (ev.target.getAttribute && ev.target.getAttribute('data-tip')) moveTip(ev);
    else hideTip();
  });
  document.addEventListener('mouseout', function (ev) {
    if (ev.target.getAttribute && ev.target.getAttribute('data-tip')) hideTip();
  });
  window.addEventListener('scroll', hideTip, true);

  var redrawTimer = null;
  window.addEventListener('resize', function () {
    hideTip();
    renderChrome();
    clearTimeout(redrawTimer);
    redrawTimer = setTimeout(drawCharts, 140);
  });

  /* =============================== EVENTS =============================== */
  document.addEventListener('click', function (ev) {
    var monthHit = ev.target.getAttribute && ev.target.getAttribute('data-month');
    if (monthHit) { hideTip(); UI.month = monthHit; render(); return; }
    if (ev.target.hasAttribute && ev.target.hasAttribute('data-scrim')) return closeDrawer();
    if (ev.target.closest && ev.target.closest('#fab')) return openQuick();

    var svcBtn = ev.target.closest && ev.target.closest('[data-svc]');
    if (svcBtn) {
      var hidden = document.getElementById('f_serviceIds');
      var ids = hidden.value.split(',').filter(Boolean);
      var id = svcBtn.getAttribute('data-svc'), at = ids.indexOf(id);
      if (at >= 0) ids.splice(at, 1); else ids.push(id);
      hidden.value = ids.join(',');
      svcBtn.setAttribute('aria-pressed', at < 0);
      svcBtn.innerHTML = (at < 0 ? ico('check') : '') + esc(svcName(id));
      syncPrice();
      return;
    }

    var tabBtn = ev.target.closest && ev.target.closest('[data-tab]');
    if (tabBtn) return setTab(tabBtn.getAttribute('data-tab'));

    var el = ev.target.closest && ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), kind = el.getAttribute('data-kind');

    switch (act) {
      case 'close': closeDrawer(); break;
      case 'save': save(); break;
      case 'quick': openQuick(); break;

      case 'month': UI.month = shiftMonth(UI.month, +el.getAttribute('data-d')); render(); break;
      case 'month-now': UI.month = curMonth(); render(); break;
      case 'job-filter': UI.jobFilter = el.getAttribute('data-v'); render(); break;
      case 'job-jump': UI.jobFilter = el.getAttribute('data-v'); UI.jobsView = 'list'; setTab('jobs'); break;
      case 'jobs-view': UI.jobsView = el.getAttribute('data-v'); UI.q = ''; render(); break;
      case 'cal-day': openDay(el.getAttribute('data-d')); break;
      case 'new-job-on': closeDrawer(); openForm('jobs', null, { date: el.getAttribute('data-d') }); break;
      case 'stock-filter': UI.stockFilter = el.getAttribute('data-v'); render(); break;
      case 'money-view': UI.moneyView = el.getAttribute('data-v'); render(); break;
      case 'order-all': UI.orderAll = !UI.orderAll; render(); break;

      case 'new-job': openForm('jobs'); break;
      case 'edit-job': openForm('jobs', id); break;
      case 'new-product': openForm('products'); break;
      case 'edit-product': openForm('products', id); break;
      case 'new-order': openForm('orders'); break;
      case 'edit-order': openForm('orders', id); break;
      case 'new-expense': openForm('expenses'); break;
      case 'edit-expense': openForm('expenses', id); break;
      case 'new-supplier': openForm('suppliers'); break;
      case 'edit-supplier': openForm('suppliers', id); break;
      case 'new-service': openForm('services'); break;
      case 'edit-service': openForm('services', id); break;
      case 'form-save': saveForm(); break;

      case 'toggle-more': {
        var grid = document.getElementById('moregrid'), btn = document.getElementById('morebtn');
        var open = grid.hasAttribute('hidden');
        if (open) grid.removeAttribute('hidden'); else grid.setAttribute('hidden', '');
        btn.innerHTML = ico('chevron') + (open ? 'Hide extra details' : 'More details');
        break;
      }
      case 'line-add': {
        var host = document.getElementById('lines');
        if (!S.products.length) { toast('Add something to Stock first.'); break; }
        var po = S.products.map(function (p) { return { v: p.id, l: p.name + (n(p.qty) ? '  (' + n(p.qty) + ' in stock)' : '  (none in stock)') }; });
        host.insertAdjacentHTML('beforeend', lineRow({ productId: po[0].v, qty: 1, cost: n(S.products[0].cost) }, po));
        break;
      }
      case 'line-del': el.closest('.itemline').remove(); break;

      case 'job-status': {
        var j = byId(S.jobs, id);
        if (j) { j.status = el.getAttribute('data-v'); touch(); render(); toast('Moved to ' + j.status.toLowerCase() + '.'); }
        break;
      }
      case 'job-paid': {
        var jb = byId(S.jobs, id);
        if (!jb) break;
        confirmBox('Got paid?', esc(jb.customer || 'This customer') + ' paying ' + money(jobOwing(jb)) +
          ' makes this job ' + money(jb.price) + ' of money in for ' + mLabel(mKey(jb.date)) + '.', 'Yes, paid', false, function () {
            jb.status = 'Paid'; jb.deposit = n(jb.price);
            touch(); render(); toast('Nice. ' + money(jb.price) + ' in.');
          });
        break;
      }

      case 'adjust': openAdjust(id); break;
      case 'adj-step': { var ai = document.getElementById('adj'); ai.value = n(ai.value) + n(el.getAttribute('data-d')); break; }
      case 'adj-save': {
        var ap = prod(ADJUST);
        if (ap) { ap.qty = n(document.getElementById('adj').value); closeDrawer(); touch(); render(); toast('Count updated.'); }
        break;
      }

      case 'receive': {
        var o = byId(S.orders, id);
        if (!o) break;
        confirmBox('It arrived?', 'This puts ' + plural(orderUnits(o), 'unit') + ' onto your stock counts.', 'Yes, it arrived', false, function () {
          if (!o.applied) { applyLines(o.items, +1); o.applied = true; }
          o.status = 'Arrived';
          touch(); render(); toast('Stock updated.');
        });
        break;
      }

      case 'del': {
        var rec = byId(S[kind], id);
        if (!rec) break;
        var name = rec.customer || rec.name || rec.ref || rec.campaign || rec.vendor || 'this';
        var extra = '';
        if (kind === 'jobs' && (rec.parts || []).length) extra = ' The parts on it go back onto your stock count.';
        if (kind === 'orders' && rec.applied) extra = ' The units it added come back off your stock count.';
        if (kind === 'services') extra = ' Jobs already using it keep their price.';
        confirmBox('Delete this ' + KIND[kind].one + '?', esc(name) + '. ' + extra.trim() + ' You cannot undo it.', 'Delete', true, function () {
          if (kind === 'jobs') applyLines(rec.parts, +1);
          if (kind === 'orders' && rec.applied) applyLines(rec.items, -1);
          S[kind] = S[kind].filter(function (r) { return r.id !== id; });
          touch(); render(); toast('Deleted.');
        });
        break;
      }
      case 'confirm-yes': { var cb = PENDING; PENDING = null; closeDrawer(); if (cb) cb(); break; }

      case 'sync-open': openSyncSetup(); break;
      case 'sync-new': {
        var code = el.getAttribute('data-v');
        closeDrawer();
        startSync(code).then(function () { render(); toast('Sync is on. Write the code down.'); })
          .catch(function () { toast('Could not turn sync on. Check you are online.'); });
        break;
      }
      case 'sync-join': {
        var joined = tidyCode(document.getElementById('joincode').value);
        if (!/^kl-/.test(joined) || joined.length < 12) { toast('That does not look like a sync code.'); break; }
        closeDrawer();
        startSync(joined).then(function () {
          render();
          if (SYNC.state === 'error') { toast('That code did not unlock anything — check you typed it right.'); return; }
          if (!SYNC.found) {
            confirmBox('Nothing stored under that code',
              'There is no data saved against ' + joined + '. Either it is typed slightly wrong, or nothing has ' +
              'been synced to it yet. This device has now claimed it — carry on and what is here becomes the copy ' +
              'everything else pulls from.', 'Got it', false, function () {});
            return;
          }
          toast('Connected. Your data is here.');
        }).catch(function () { toast('Could not connect. Check you are online.'); });
        break;
      }
      case 'sync-now': pullNow().then(function () { return pushNow(); }).then(function () { render(); }); break;
      case 'sync-copy': {
        var c = SYNC.code;
        if (navigator.clipboard) navigator.clipboard.writeText(c).then(function () { toast('Code copied.'); },
          function () { showText('sync-code.txt', c); });
        else showText('sync-code.txt', c);
        break;
      }
      case 'sync-off': {
        confirmBox('Turn off sync here?', 'This device keeps what it already has, but stops sending and receiving. ' +
          'Your data stays on the other devices. You can turn it back on with the same code.', 'Turn it off', true, function () {
            stopSync(); render(); toast('Sync off on this device.');
          });
        break;
      }
      case 'conflict-keep': resolveConflict(el.getAttribute('data-v')); break;

      case 'paste': openPaste(kind); break;
      case 'paste-go': commitPaste(); break;
      case 'export': exportKind(kind); break;
      case 'import-json': openImportJson(); break;
      case 'copy-all': {
        var ta = document.getElementById('copytext'); ta.focus(); ta.select();
        try { document.execCommand('copy'); toast('Copied.'); } catch (e) { toast('Press Ctrl or Cmd + C to copy.'); }
        break;
      }
      case 'restore': {
        var data;
        try { data = JSON.parse(document.getElementById('jsonin').value); } catch (e) { toast('That is not a backup file.'); break; }
        if (!data || data.v !== 2) { toast('That backup is from a different version.'); break; }
        S = data;
        ['services', 'jobs', 'products', 'orders', 'expenses', 'suppliers'].forEach(function (k) { if (!Array.isArray(S[k])) S[k] = []; });
        if (!S.meta) S.meta = emptyState().meta;
        closeDrawer(); applyTheme(); touch(); render(); toast('Backup is back. Press Save to keep it.');
        break;
      }
      case 'wipe': {
        confirmBox('Delete everything?', 'Every job, stock item, order, bill and contact goes. Download a backup first if you are not sure.', 'Delete everything', true, function () {
          var meta = S.meta, services = S.services;
          S = emptyState(); S.meta = meta; S.services = services;
          touch(); render(); toast('All clear.');
        });
        break;
      }
    }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'q') { UI.q = t.value; render(); return; }
    if (t.id === 'paste') { previewPaste(); return; }
    if (t.hasAttribute && t.hasAttribute('data-set')) {
      S.meta[t.getAttribute('data-set')] = t.value;
      if (t.getAttribute('data-set') === 'theme') applyTheme();
      touch();
      if (t.getAttribute('data-set') === 'business') renderChrome();
    }
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.getAttribute && t.getAttribute('data-ik') === 'productId') {
      var p = prod(t.value), row = t.closest('.itemline'), c = row && row.querySelector('[data-ik="cost"]');
      if (p && c && !n(c.value)) c.value = n(p.cost);
    }
    if (t.getAttribute && t.getAttribute('data-set') === 'theme') { S.meta.theme = t.value; applyTheme(); touch(); }
  });

  document.addEventListener('keydown', function (ev) {
    var day = ev.target.closest && ev.target.closest('.cal-day');
    if (day && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openDay(day.getAttribute('data-d')); return; }
    if (ev.key === 'Escape' && document.querySelector('.scrim')) closeDrawer();
    if ((ev.metaKey || ev.ctrlKey) && ev.key === 's') { ev.preventDefault(); if (DIRTY) save(); }
  });
  window.addEventListener('beforeunload', function (e) {
    if (DIRTY && !saving && ARTIFACT && !READONLY) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ================================ INIT ================================ */
  loadState();
  UI = { tab: 'home', month: curMonth(), q: '', jobFilter: 'open', jobsView: 'list', stockFilter: 'all', moneyView: 'out', orderAll: false };
  try {
    var saved = JSON.parse(sessionStorage.getItem('kl.ui') || 'null');
    if (saved && saved.tab) { UI = saved; UI.q = ''; }
    sessionStorage.removeItem('kl.ui');
  } catch (e) {}
  applyTheme();
  render();

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && DIRTY && ARTIFACT && !READONLY && !saving) save();
  });

  if (window.claude && window.claude.use) {
    window.claude.use('artifact').then(function (a) {
      ARTIFACT = a;
      renderChrome();
      if (DIRTY) autosaveSoon();
    });
    window.claude.use('downloads').then(function (d) { DOWNLOADS = d; });
  }

  if (syncAvailable()) {
    var savedCode = null;
    try { savedCode = localStorage.getItem(LS_CODE); } catch (e) {}
    if (savedCode) {
      prepare(savedCode).then(function (pp) {
        SYNC.code = savedCode; SYNC.id = pp.id; SYNC.key = pp.key;
        try { SYNC.base = n(localStorage.getItem(LS_BASE)); } catch (e) {}
        return pullNow();
      });
    }
    // coming back to the tab is the moment another device's changes matter
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && syncOn() && Date.now() - SYNC.pulledAt > 20000) pullNow(true);
    });
    window.addEventListener('online', function () { if (syncOn()) pullNow(true).then(pushNow); });
    setInterval(function () { if (syncOn() && SYNC.state === 'ok') renderChrome(); }, 60000);
  }
})();
</script>
</body>
</html>
