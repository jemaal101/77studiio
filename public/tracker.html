  /* ---------------------------------------------- every invoice, one list */
  function invoicesView() {
    if (!S.invoices.length) {
      return '<section class="card">' + emptyBlock('doc', 'No invoices or receipts yet',
        'Write one and it makes the job for you. It comes out with your logo, name, ABN and bank details on it. ' +
        'An invoice becomes a receipt the moment you mark it paid.',
        '<button class="btn primary big" data-act="new-invoice">' + ico('doc') + 'Write an invoice</button>' +
        '<button class="btn big" data-act="new-receipt">' + ico('check') + 'Write a receipt</button>' +
        '<button class="btn big" data-tab="settings">' + ico('cog') + 'Put my details in first</button>') + '</section>';
    }
    var f = UI.invFilter || 'all';
    var all = sortBy(S.invoices, function (v) { return v.date || ''; }, 'desc');
    var list = all.filter(function (v) {
      var j = invJob(v);
      if (f === 'unsent' && v.sent) return false;
      if (f === 'unpaid' && invPaid(v)) return false;
      if (f === 'paid' && !invPaid(v)) return false;
      return hit([v.no, v.note, j ? j.customer : '', j ? j.car : '', j ? j.rego : ''].join(' '));
    });
    var owed = unpaidInvoices().reduce(function (a, v) { return a + invTotals(v).due; }, 0);
    var thisMonth = all.filter(function (v) { return mKey(v.date) === UI.month; });

    var h = '<div class="tiles" style="margin-top:0;margin-bottom:16px">' +
      tile('Raised in ' + mLabel(UI.month), money(thisMonth.reduce(function (a, v) { return a + invTotal(v); }, 0)),
        plural(thisMonth.length, 'invoice')) +
      tile('Still to be paid', money(owed), plural(unpaidInvoices().length, 'invoice') + ' outstanding') +
      tile('Not sent yet', unsentInvoices().length + '', unsentInvoices().length ? 'sitting here waiting on you' : 'every one is out') +
      tile('All up', plural(all.length, 'invoice'), 'Next number ' + nextInvNo()) +
      '</div>';

    h += '<div class="toolbar">' + searchBar('Search a number, name or car…') +
      seg('inv-filter', [
        { v: 'all', l: 'All', n: all.length || '' },
        { v: 'unsent', l: 'Not sent', n: unsentInvoices().length || '' },
        { v: 'unpaid', l: 'Not paid', n: unpaidInvoices().length || '' },
        { v: 'paid', l: 'Paid', n: '' }
      ], f) + '</div>';

    if (!list.length) {
      return h + '<section class="card">' + emptyBlock('search', 'Nothing here',
        UI.q.trim() ? 'Try another number, name or car.' : 'Try another tab above.') + '</section>';
    }
    return h + '<section class="card"><div class="card-b flush"><div class="rows">' +
      list.map(invRow).join('') + '</div></div></section>';
  }

  function invRow(v) {
    var j = invJob(v), t = invTotals(v), paid = invPaid(v);
    var late = !paid && v.due && days(v.due) != null && days(v.due) < 0;
    return '<div class="row tap" data-act="open-invoice" data-id="' + v.id + '">' +
      '<span class="grow"><span class="t truncate"><span class="num">' + esc(v.no) + '</span> · ' +
      esc(j ? (j.customer || 'No name') : 'Job deleted') + '</span>' +
      '<br><span class="s truncate">' + esc(dLabel(v.date)) +
      (j && j.car ? ' · ' + esc(j.car) : '') +
      (paid ? '' : ' · due ' + esc(dLabel(v.due))) + '</span></span>' +
      '<span class="chips" style="flex:none">' +
      (paid ? '' : v.sent ? '' : '<span class="chip amb">not sent</span>') +
      (paid ? '<span class="chip good">receipt</span>' : late ? '<span class="chip bad">overdue</span>' : '') +
      '</span>' +
      '<span class="num" style="font-weight:600;flex:none">' + money(t.total) + '</span></div>';
  }

          '<td class="num" data-l="Charged">' + money(j.price) + '</td>' +
          '<td class="num" data-l="Cost you">' + money(jobCost(j)) + '</td>' +

  /* ============================= CONTACTS =============================== */
  function viewContacts() {
    var list = S.suppliers.filter(function (s) {
      return hit([s.name, s.contact, s.country, s.email, s.phone, s.notes, s.terms].join(' '));
    });
    list = sortBy(list, function (s) { return (s.name || '').toLowerCase(); });

    var h = '<div class="toolbar">' + searchBar('Search a supplier…') +
      '<button class="btn primary" data-act="new-supplier">' + ico('plus') + 'Add a contact</button>' +
      '<button class="btn" data-act="paste" data-kind="suppliers">' + ico('clip') + 'Paste a list</button></div>';

    if (!S.suppliers.length) {
      return h + '<section class="card">' + emptyBlock('users', 'No contacts yet',
        'Film and vinyl suppliers, parts importers, the local wheel shop — everyone you buy from, in one place you can call from.',
        '<button class="btn primary big" data-act="new-supplier">' + ico('plus') + 'Add your first contact</button>') + '</section>';
    }
    if (!list.length) return h + '<section class="card">' + emptyBlock('search', 'Nothing here', 'Try another search.') + '</section>';

    return h + '<div class="grid g2">' + list.map(function (s) {
      var open = S.orders.filter(function (o) { return o.supplierId === s.id && orderOpen(o); }).length;
      var items = S.products.filter(function (p) { return p.supplierId === s.id; }).length;
      var spent = S.orders.filter(function (o) { return o.supplierId === s.id && o.status !== 'Cancelled'; })
        .reduce(function (a, o) { return a + orderTotal(o); }, 0);
      var links = '';
      if (s.phone) links += '<a href="tel:' + esc(String(s.phone).replace(/\s/g, '')) + '">' + ico('phone') + esc(s.phone) + '</a>';
      if (s.whatsapp) links += '<a href="https://wa.me/' + esc(String(s.whatsapp).replace(/[^0-9]/g, '')) + '" target="_blank" rel="noopener">' + ico('chat') + 'WhatsApp</a>';
      if (s.email) links += '<a href="mailto:' + esc(s.email) + '">' + ico('mail') + esc(s.email) + '</a>';
      if (safeUrl(s.link)) links = '<a href="' + esc(safeUrl(s.link)) + '" target="_blank" rel="noopener">' +
        ico('chat') + esc('Open ' + (s.platform || 'chat')) + '</a>' + links;
      if (safeUrl(s.website)) links += '<a href="' + esc(safeUrl(s.website)) + '" target="_blank" rel="noopener">' + ico('globe') + esc(String(s.website).replace(/^https?:\/\//, '')) + '</a>';
      return '<section class="card"><div class="card-h"><div style="min-width:0;flex:1">' +
        '<h3 class="truncate">' + esc(s.name) + '</h3></div>' +
        '<button class="btn icon sm" data-act="edit-supplier" data-id="' + s.id + '" aria-label="Edit contact">' + ico('pencil') + '</button>' +
        '<button class="btn icon sm" data-act="del" data-kind="suppliers" data-id="' + s.id + '" aria-label="Delete contact">' + ico('trash') + '</button>' +
        '</div><div class="card-b">' +
        '<div class="hint" style="margin-bottom:13px">' + esc(s.contact || 'No contact name') + (s.country ? ' · ' + esc(s.country) : '') + '</div>' +
        (links ? '<div class="linkrow" style="margin-bottom:14px">' + links + '</div>' :
          '<div class="hint" style="margin-bottom:14px">No phone or email saved yet.</div>') +
        '<div class="chips">' +
        (s.platform ? '<span class="chip acc">' + esc(s.platform) + '</span>' : '') +
        (n(s.leadTime) ? '<span class="chip">usually ' + n(s.leadTime) + ' days to land</span>' : '') +
        (open ? '<span class="chip amb">' + plural(open, 'order') + ' on the way</span>' : '') +
        (items ? '<span class="chip">' + plural(items, 'item') + ' from them</span>' : '') +
        (spent ? '<span class="chip">' + money(spent) + ' ordered all up</span>' : '') +
        '</div>' +
        (s.terms ? '<div class="hint" style="margin-top:13px"><strong>Terms:</strong> ' + esc(s.terms) + '</div>' : '') +
        (s.notes ? '<div class="hint" style="margin-top:8px">' + esc(s.notes) + '</div>' : '') +
        '</div></section>';
    }).join('') + '</div>';
  }

  function syncCard() {
    if (window.claude && window.claude.use && ASKED && !ARTIFACT) {
      return '<section class="card"><div class="card-h">' + ico('globe') + '<h3>Where this is kept</h3></div>' +
        '<div class="card-b stack">' +
        '<div class="hint">This copy keeps everything in this browser, on this device. It is yours ' +
        'and nobody else can see it \u2014 but it does not follow you to another phone or computer, ' +
        'and clearing your browsing data clears it.</div>' +
        '<div><button class="btn" data-act="export" data-kind="backup">' + ico('down') + 'Download a backup</button></div>' +
        '</div></section>';
    }
    if (window.claude && window.claude.use) {
      return '<section class="card"><div class="card-h">' + ico('globe') + '<h3>Your devices</h3>' +
        '<div class="spacer"></div><span class="chip ' + (ARTIFACT ? 'good' : '') + '">' +
        (ARTIFACT ? 'On' : 'Checking…') + '</span></div><div class="card-b stack">' +
        '<div class="hint">Nothing to set up. It saves itself, so the same link opens with all your work ' +

        '<div><button class="btn primary" data-act="save">' + ico('check') + 'Save right now</button></div>' +
        '</div></section>';
    }
    if (!syncAvailable()) {
      return '<section class="card"><div class="card-h">' + ico('globe') + '<h3>Sync across devices</h3></div>' +
        '<div class="card-b"><div class="hint">Not available in this browser.</div></div></section>';
    }
    var on = syncOn();
    return '<section class="card"><div class="card-h">' + ico('globe') + '<h3>Sync across devices</h3>' +
      '<div class="spacer"></div><span class="chip ' + (on ? 'good' : '') + '">' + (on ? 'On' : 'Off') + '</span></div>' +
      '<div class="card-b stack">' +
      (on
        ? '<div class="hint">Everything you change here reaches your other devices within a few seconds, ' +
          'and theirs reaches you when you open the page. It keeps working with no signal and catches up later.</div>'
        : '<div class="hint">Turn this on and your jobs, stock, money and contacts follow you to every phone and ' +
          'computer you use. You get one code to type on each device — no account, no password. ' +
          'Everything is scrambled before it leaves this browser, so the server cannot read it.</div>') +
      (on
        ? '<div><div class="eyebrow">Your sync code</div>' +
          '<div class="num" style="font-size:22px;font-weight:600;margin-top:4px;word-break:break-all">' + esc(SYNC.code) + '</div>' +

          '<button class="btn danger" data-act="sync-off">Turn off here</button></div>' +
          '<div class="hint">Keep the code somewhere safe. It is the only way in, and nobody — including me — can ' +
          'recover your data without it.</div>'

      '</div></section>';

  /** Whatever they hand over gets scaled down and re-encoded here, so a 4MB
      phone photo does not end up living inside every saved copy. */
  function readLogo(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast('That is not a picture.'); return; }
    if (file.size > 12 * 1024 * 1024) { toast('That picture is too big. Try one under 12MB.'); return; }
    var fr = new FileReader();
    fr.onerror = function () { toast('Could not read that picture.'); };
    fr.onload = function () {
      var img = new Image();
      img.onerror = function () { toast('Could not read that picture.'); };
      img.onload = function () {
        var max = 660, w = img.width, h = img.height;
        if (!w || !h) { toast('Could not read that picture.'); return; }
        if (w > max) { h = Math.round(h * max / w); w = max; }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        var uri;
        try { uri = c.toDataURL('image/png'); } catch (e) { toast('Could not read that picture.'); return; }
        biz().logo = uri;
        touch(); render(); toast('Logo saved. It is on your invoices now.');
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  /** Works out, live, what is left of the price once the shelf and the
      materials are paid for. This is the whole point of counting in cars. */
  function syncKeep() {
    var box = document.getElementById('keepstrip');
    if (!box || !FORM || FORM.kind !== 'jobs') return;
    var el = function (id) { var e = document.getElementById(id); return e ? n(e.value) : 0; };
    var price = el('f_price'), mat = el('f_materials'), parts = 0, rows = [];
    var host = document.querySelector('.drawer-b');
    if (host) host.querySelectorAll('.itemline').forEach(function (row) {
      var sel = row.querySelector('[data-ik="productId"]');
      var q = n((row.querySelector('[data-ik="qty"]') || {}).value);
      var c = n((row.querySelector('[data-ik="cost"]') || {}).value);
      var pr = prod(sel && sel.value);
      if (!pr || q <= 0) return;
      parts += q * c;
      rows.push({ n: pr.name, q: q, c: c, sh: shared(pr) });
    });
    var cost = parts + mat, keep = price - cost;
    if (!price && !cost) {
      box.innerHTML = '<div class="eyebrow">What you actually make on this</div>' +
        '<div class="hint" style="margin-top:5px">Put in the price and what you used, and the sum lands here.</div>';
      return;
    }
    var line = function (l, v, cls) {
      return '<div class="kr' + (cls ? ' ' + cls : '') + '"><span>' + esc(l) + '</span><span class="num">' + esc(v) + '</span></div>';
    };
    var h = '<div class="eyebrow">What you actually make on this</div>' + line('You charge', money2(price));
    rows.forEach(function (r) {
      h += line((r.sh ? carsWorth(r.q) + ' of ' : r.q + ' \u00d7 ') + r.n +
        '  (' + money2(r.c) + (r.sh ? ' a car' : ' each') + ')', '\u2212' + money2(r.q * r.c));
    });
    if (mat) h += line('Film, vinyl or polish', '\u2212' + money2(mat));
    h += line('You keep', money2(keep), 'tot');
    h += '<div class="hint" style="margin-top:6px">' +
      (price > 0
        ? (keep >= 0 ? Math.round((keep / price) * 100) + '\u00a2 of every dollar they pay you stays with you.'
          : 'This one costs you more than it brings in.')
        : 'No price on it yet.') + '</div>';
    box.innerHTML = h;
  }

  /** An order lands about when the supplier usually takes, so fill that in
      and it gives way the moment a real date is typed in. */
  function syncEta() {
    if (!FORM || FORM.kind !== 'orders') return;
    var eta = document.getElementById('f_eta'), ord = document.getElementById('f_ordered');
    if (!eta || !ord || !ord.value) return;
    if (eta.value && eta.value !== FORM.autoEta) return;      // typed over, leave it alone
    var sup = document.getElementById('f_supplierId'), ship = document.getElementById('f_ship');
    var sp = sup ? byId(S.suppliers, sup.value) : null;
    var d = sp && n(sp.leadTime) ? n(sp.leadTime) : (ship ? n(SHIP_DAYS[ship.value]) : 0);
    if (!d) return;
    var t = new Date(ord.value + 'T00:00:00');
    if (isNaN(t.getTime())) return;
    t.setDate(t.getDate() + d);
    eta.value = FORM.autoEta = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
  }

  function readForm() {
    var host = document.querySelector('.drawer-b'), out = {};
    if (!host) return out;

    var lines = [];

      var o = {};
      row.querySelectorAll('[data-ik]').forEach(function (el) { o[el.getAttribute('data-ik')] = el.value; });
      if (o.productId && n(o.qty) > 0)
        lines.push({ productId: o.productId, qty: n(o.qty), cost: n(o.cost), per: Math.max(1, n(o.per) || 1) });
    });
    out._lines = lines;
    return out;
  }

  function saveForm() {
    var kind = FORM.kind, def = KIND[kind], vals = readForm();
    var missing = def.fields.filter(function (f) { return f.req && !String(vals[f.k] == null ? '' : vals[f.k]).trim(); });
    if (missing.length) {
      toast('Put in the ' + missing[0].l.toLowerCase() + ' first.');
      var el = document.getElementById('f_' + missing[0].k); if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
      return;
    }
    var rec = FORM.id ? byId(S[kind], FORM.id) : null;
    var isNew = !rec;
    if (isNew) rec = { id: uid(kind.slice(0, 2)) };

    // undo whatever the old version did to stock, then write the new truth
    if (kind === 'jobs' && FORM.before) applyLines(FORM.before.parts, +1);
    if (kind === 'orders' && FORM.before && FORM.before.applied) applyLines(FORM.before.items, -1);

    def.fields.forEach(function (f) {
      if (f.t === 'lines') { rec[f.k] = vals._lines; return; }
      if (f.t === 'services') {
        rec[f.k] = String(vals[f.k] || '').split(',').filter(Boolean);
        return;
      }
      var v = vals[f.k];
      rec[f.k] = (f.t === 'money' || f.t === 'int') ? n(v) : String(v == null ? '' : v).trim();
    });

    if (kind === 'jobs') applyLines(rec.parts, -1);
    if (kind === 'orders') {
      if (rec.status === 'Arrived') { applyLines(rec.items, +1); rec.applied = true; }
      else rec.applied = false;
    }
    if (isNew) S[kind].push(rec);

    closeDrawer(); touch(); render();
    toast(isNew ? def.title + ' added.' : 'Saved.');

  /** A job line is counted in cars, an order line in whole rolls; `per` says
      how many cars one roll did at the time, so old lines still balance even
      if you change that number later. */
  function applyLines(lines, dir) {
    (lines || []).forEach(function (l) {
      var p = prod(l.productId);
      if (!p) return;
      var units = n(l.qty) / Math.max(1, n(l.per) || 1);
      p.qty = Math.round((n(p.qty) + dir * units) * 1000) / 1000;
    });
  }

  /* ========================== PASTE FROM A SHEET ======================== */
  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  var ALIAS = {
    products: { item: 'name', part: 'name', product: 'name', description: 'name', whatisit: 'name', type: 'category', supplier: 'supplierId', vendor: 'supplierId', buyprice: 'cost', whatonecostsyou: 'cost', costprice: 'cost', unitcost: 'cost', whatitcostsyou: 'cost', sellprice: 'price', rrp: 'price', retail: 'price', whatyousellitfor: 'price', quantity: 'qty', stock: 'qty', instock: 'qty', onhand: 'qty', howmanyyouhave: 'qty', uses: 'uses', cars: 'uses', carsperroll: 'uses', howmanycars: 'uses', howmanycarsdoesonedo: 'uses', reorder: 'reorder', reorderpoint: 'reorder', warnmeat: 'reorder', tellmewheniamdownto: 'reorder', partnumber: 'sku', code: 'sku', codeorpartnumber: 'sku', shelf: 'location', bin: 'location', whereitsits: 'location' },
    suppliers: { supplier: 'name', company: 'name', businessname: 'name', contactperson: 'contact', person: 'contact', personyoudealwith: 'contact', mobile: 'phone', tel: 'phone', wechat: 'whatsapp', web: 'website', url: 'website', leadtime: 'leadTime', leadtimedays: 'leadTime', howmanydaystheytake: 'leadTime', paymentterms: 'terms', whereitheyare: 'country', whereareyare: 'country', location: 'country' },
    expenses: { spend: 'amount', cost: 'amount', total: 'amount', howmuch: 'amount', when: 'date', whatkind: 'category', type: 'category', paidto: 'vendor', payee: 'vendor', supplier: 'vendor', whatfor: 'campaign', description: 'campaign', purpose: 'campaign', adplatform: 'platform', whichadplatform: 'platform', channel: 'platform' },
    jobs: { name: 'customer', client: 'customer', customername: 'customer', vehicle: 'car', make: 'car', model: 'car', plate: 'rego', registration: 'rego', when: 'date', amount: 'price', charged: 'price', total: 'price', priceyouarecharging: 'price', whereitisat: 'status', deposit: 'deposit' }
  };
  function fieldFor(kind, header) {
    var h = norm(header), a = ALIAS[kind] || {}, hit = null;
    if (a[h]) return a[h];
    KIND[kind].fields.forEach(function (f) {
      if (f.t === 'lines' || f.t === 'services') return;
      if (norm(f.k) === h || norm(f.l) === h) hit = f.k;
    });
    return hit;
  }
  function splitLine(line, d) {
    var out = [], cur = '', q = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (q) { if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
      else if (c === '"') q = true;
      else if (c === d) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out.map(function (x) { return x.trim(); });
  }
  function normDate(v) {
    v = String(v || '').trim(); if (!v) return '';
    if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
    var m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (m) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad(+m[2]) + '-' + pad(+m[1]);
    var d = new Date(v);
    return isNaN(d) ? '' : d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function findSupplier(v, commit) {
    v = String(v || '').trim(); if (!v) return '';
    if (byId(S.suppliers, v)) return v;
    for (var i = 0; i < S.suppliers.length; i++) if (norm(S.suppliers[i].name) === norm(v)) return S.suppliers[i].id;
    if (!commit) return '';
    var s = blank('suppliers'); s.name = v; S.suppliers.push(s); return s.id;
  }

  function buildImport(kind, text, commit) {
    var lines = String(text).replace(/\r\n?/g, '\n').split('\n').filter(function (l) { return l.trim(); });
    if (!lines.length) return { rows: [], skipped: 0 };
    var d = lines[0].indexOf('\t') >= 0 ? '\t' : ',';
    var table = lines.map(function (l) { return splitLine(l, d); });
    var usable = KIND[kind].fields.filter(function (f) { return f.t !== 'lines' && f.t !== 'services'; });
    var mapped = table[0].map(function (hh) { return fieldFor(kind, hh); });
    var cols, body;
    if (mapped.filter(Boolean).length >= 2) { cols = mapped; body = table.slice(1); }
    else { cols = usable.map(function (f) { return f.k; }); body = table; }

    var rows = [], skipped = 0;
    body.forEach(function (cells) {
      if (!cells.join('').trim()) return;
      var rec = blank(kind);
      cols.forEach(function (k, i) {
        if (!k || i >= cells.length) return;
        var v = cells[i];
        if (k === 'supplierId') { var sid = findSupplier(v, commit); rec.supplierId = sid; if (!sid && String(v).trim()) rec._new = String(v).trim(); return; }
        var f = usable.filter(function (x) { return x.k === k; })[0];
        rec[k] = f && (f.t === 'money' || f.t === 'int') ? n(v) : f && f.t === 'date' ? normDate(v) : v;
      });
      var bad = (kind === 'expenses' && !n(rec.amount)) ||
        ((kind === 'products' || kind === 'suppliers') && !String(rec.name).trim()) ||
        (kind === 'jobs' && !String(rec.customer).trim());
      if (bad) { skipped++; return; }
      if (kind === 'jobs' && JOB_STATUS.indexOf(rec.status) < 0) rec.status = 'Booked';
      if (!rec.date && KIND[kind].fields.some(function (f) { return f.k === 'date'; })) rec.date = todayISO();
      rows.push(rec);
    });
    return { rows: rows, skipped: skipped };
  }

  function openPaste(kind) {
    PASTE_KIND = kind;
    var def = KIND[kind];
    var cols = def.fields.filter(function (f) { return f.t !== 'lines' && f.t !== 'services'; })

    drawer('Paste in your ' + def.label.toLowerCase(),
      '<div class="hint">Copy the rows out of Excel, Sheets or Numbers and paste them in. If the top row has headings they get matched by name — otherwise the columns are read in this order:</div>' +
      '<div class="hint" style="background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.8">' + esc(cols) + '</div>' +
      '<div class="field"><label for="paste">Paste here</label><textarea class="inp" id="paste" rows="8"></textarea></div>' +
      '<div id="paste-preview"></div>',
      '<button class="btn ghost" data-act="close">Cancel</button><div class="spacer"></div>' +
      '<button class="btn primary" data-act="paste-go" id="paste-go" disabled>' + ico('check') + 'Bring it in</button>');
  }

  function previewPaste() {
    var ta = document.getElementById('paste'), host = document.getElementById('paste-preview'), btn = document.getElementById('paste-go');
    if (!ta || !host) return;

      host.innerHTML = ta.value.trim() ? '<div class="banner">' + ico('alert') +

      btn.disabled = true; btn.innerHTML = ico('check') + 'Bring it in';
      return;
    }
    var show = KIND[PASTE_KIND].fields.filter(function (f) { return f.t !== 'lines' && f.t !== 'services'; }).slice(0, 4);
    host.innerHTML = '<div class="eyebrow" style="margin-bottom:9px">Check this looks right</div>' +
      '<div class="tablewrap" style="border:1px solid var(--line);border-radius:10px"><table><thead><tr>' +
      show.map(function (f) { return '<th>' + esc(f.l) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      res.rows.slice(0, 4).map(function (r) {
        return '<tr>' + show.map(function (f) {
          var v = r[f.k];
          if (f.k === 'supplierId') v = r._new ? r._new + ' (new)' : supName(v);
          if (f.t === 'money') v = money2(v);
          return '<td class="' + (f.t === 'money' || f.t === 'int' ? 'num' : '') + '">' + esc(v === '' || v == null ? '—' : v) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>' +
      (res.skipped ? '<div class="hint" style="margin-top:9px">' + plural(res.skipped, 'row') + ' will be left out — missing a name or an amount.</div>' : '');
    btn.disabled = false;
    btn.innerHTML = ico('check') + 'Bring in ' + plural(res.rows.length, 'row');
  }

  function commitPaste() {
    var res = buildImport(PASTE_KIND, document.getElementById('paste').value, true);
    if (!res.rows.length) return;
    res.rows.forEach(function (r) { delete r._new; S[PASTE_KIND].push(r); });
    closeDrawer(); touch(); render();
    toast('Brought in ' + plural(res.rows.length, 'row') + '.' + (res.skipped ? ' ' + res.skipped + ' left out.' : ''));
  }

  /* =============================== EXPORT =============================== */
  function csv(v) { var s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function toCSV(kind) {
    if (kind === 'orders') {
      var out = [['Order', 'Supplier', 'Status', 'Ordered', 'Expected', 'Item', 'Qty', 'Cost each', 'Line total', 'Freight', 'Duty', 'Notes'].map(csv).join(',')];
      S.orders.forEach(function (o) {
        var items = (o.items || []).length ? o.items : [{ productId: '', qty: 0, cost: 0 }];
        items.forEach(function (it, i) {

        var j = invJob(v) || {}, t = invTotals(v);

    if (ev.key === 'Escape' && document.querySelector('.scrim')) closeDrawer();
    else if (ev.key === 'Escape' && INVOICE) closeInvoice();
    if ((ev.metaKey || ev.ctrlKey) && ev.key === 's') { ev.preventDefault(); if (DIRTY) save(); }
  });
  window.addEventListener('beforeunload', function (e) {
    if (DIRTY && !saving && ARTIFACT && !READONLY) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ================================ INIT ================================ */
  loadState();
  UI = { tab: 'home', month: curMonth(), q: '', jobFilter: 'open', jobsView: 'list', stockFilter: 'all', moneyView: 'invoices', invFilter: 'all', orderFilter: 'open' };
  try {
    var saved = JSON.parse(sessionStorage.getItem('kl.ui') || 'null');
    if (saved && saved.tab) { UI = saved; UI.q = ''; }
    sessionStorage.removeItem('kl.ui');
  } catch (e) {}
  applyTheme();
  render();

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && DIRTY && ARTIFACT && !READONLY && !saving) save();
  });

  if (window.claude && window.claude.use) {
    window.claude.use('artifact').then(function (a) {
      ARTIFACT = a; ASKED = true;
      render();
      if (DIRTY) autosaveSoon();
    }, function () { ASKED = true; render(); });
    window.claude.use('downloads').then(function (d) { DOWNLOADS = d; });
  }

  if (syncAvailable()) {
    var savedCode = null;
    try { savedCode = localStorage.getItem(LS_CODE); } catch (e) {}
    if (savedCode) {
      prepare(savedCode).then(function (pp) {
        SYNC.code = savedCode; SYNC.id = pp.id; SYNC.key = pp.key;
        try { SYNC.base = n(localStorage.getItem(LS_BASE)); } catch (e) {}
        return pullNow();
      });
    }
    // coming back to the tab is the moment another device's changes matter
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && syncOn() && Date.now() - SYNC.pulledAt > 20000) pullNow(true);
    });
    window.addEventListener('online', function () { if (syncOn()) pullNow(true).then(pushNow); });
    setInterval(function () { if (syncOn() && SYNC.state === 'ok') renderChrome(); }, 60000);
  }
})();
</script>
</body>
</html>
